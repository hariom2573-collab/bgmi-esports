
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#050B18">

<title>My Matches</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top,#17233d 0%,#07101f 38%,#02050b 100%);
    color:#fff;
    padding:18px;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
}

/* HEADER */

.header{
    margin-bottom:20px;
}

.header-title{
    font-size:24px;
    font-weight:800;
}

.header-subtitle{
    color:#8795aa;
    font-size:12px;
    margin-top:5px;
}


/* TABS */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:5px;
    background:#0b1424;
    border:1px solid rgba(255,255,255,.07);
    border-radius:15px;
    margin-bottom:18px;
}

.tab{
    border:0;
    padding:12px 8px;
    border-radius:11px;
    background:transparent;
    color:#8c99ad;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.tab.active{
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
    color:#fff;
    box-shadow:0 6px 20px rgba(37,99,235,.22);
}


/* COUNT */

.count-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    margin-bottom:15px;
    background:
    linear-gradient(135deg,rgba(20,32,54,.95),rgba(7,14,26,.98));
    border:1px solid rgba(255,255,255,.07);
    border-radius:16px;
}

.count-label{
    color:#8f9db1;
    font-size:12px;
}

.count-number{
    font-size:21px;
    font-weight:800;
}


/* MATCH CARD */

.match-card{
    position:relative;
    background:
    linear-gradient(145deg,rgba(19,31,52,.98),rgba(5,10,19,.98));
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:17px;
    margin-bottom:13px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.22);
    cursor:pointer;
    transition:.18s ease;
}

.match-card:active{
    transform:scale(.98);
}

.match-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:4px;
    height:100%;
    background:#2563eb;
}

.match-card.played::before{
    background:#64748b;
}


/* TOP */

.match-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:13px;
}

.match-name{
    font-size:17px;
    font-weight:800;
}

.match-type{
    color:#8390a4;
    font-size:11px;
    margin-top:4px;
}

.status{
    padding:6px 9px;
    border-radius:8px;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
}

.status.upcoming{
    color:#86efac;
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.20);
}

.status.played{
    color:#aeb8c8;
    background:rgba(100,116,139,.12);
    border:1px solid rgba(100,116,139,.20);
}


/* DETAILS */

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.detail{
    padding:10px;
    background:rgba(255,255,255,.035);
    border-radius:11px;
}

.detail-label{
    color:#78869a;
    font-size:10px;
    margin-bottom:4px;
}

.detail-value{
    color:#e8edf5;
    font-size:12px;
    font-weight:700;
}


/* BOTTOM */

.slot-box{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.06);
}

.slot-label{
    color:#8290a4;
    font-size:11px;
}

.slot-value{
    color:#FFD700;
    font-size:14px;
    font-weight:800;
}

.tap-text{
    margin-top:12px;
    color:#64748b;
    font-size:10px;
    text-align:right;
}


/* EMPTY */

.empty{
    text-align:center;
    padding:55px 20px;
    color:#7d8a9e;
}

.empty-icon{
    font-size:42px;
    margin-bottom:12px;
}

.empty-title{
    color:#d9e0eb;
    font-size:16px;
    font-weight:700;
    margin-bottom:6px;
}

.empty-text{
    font-size:12px;
    line-height:1.5;
}


/* LOADING */

.loading{
    text-align:center;
    padding:50px 20px;
    color:#8997ab;
    font-size:13px;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid rgba(255,255,255,.10);
    border-top-color:#2563eb;
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:9999;

    display:none;
    align-items:flex-end;
    justify-content:center;

    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);

    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;

    background:
    linear-gradient(
        145deg,
        #101c30,
        #050b15
    );

    border:1px solid rgba(255,255,255,.10);
    border-radius:24px 24px 18px 18px;

    padding:20px;

    box-shadow:0 -10px 50px rgba(0,0,0,.55);

    animation:slideUp .22s ease;
}

@keyframes slideUp{

    from{
        transform:translateY(30px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }

}


/* MODAL HEADER */

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;

    margin-bottom:18px;
}

.modal-title{
    font-size:20px;
    font-weight:800;
}

.modal-subtitle{
    color:#8190a5;
    font-size:11px;
    margin-top:5px;
}

.close-btn{
    width:36px;
    height:36px;

    border:0;
    border-radius:11px;

    background:#182338;
    color:#fff;

    font-size:20px;
    cursor:pointer;
}


/* ROOM BOX */

.room-box{
    padding:17px;
    border-radius:17px;

    background:
    linear-gradient(
        135deg,
        rgba(37,99,235,.16),
        rgba(20,35,60,.55)
    );

    border:1px solid rgba(59,130,246,.25);

    margin-bottom:14px;
}

.room-title{
    font-size:12px;
    color:#8ea0ba;
    margin-bottom:13px;
}

.room-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    padding:11px 0;

    border-bottom:1px solid rgba(255,255,255,.07);
}

.room-row:last-child{
    border-bottom:0;
}

.room-label{
    color:#8190a5;
    font-size:11px;
}

.room-value{
    color:#fff;
    font-size:15px;
    font-weight:800;
    word-break:break-all;
    text-align:right;
}

.password{
    color:#FFD700;
}


/* COPY */

.copy-btn{
    margin-top:7px;

    width:100%;

    padding:12px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:12px;

    background:#121d30;

    color:#dce5f3;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

.copy-btn:active{
    transform:scale(.98);
}


/* OPEN ROOM */

.open-room{
    display:none;

    width:100%;

    padding:13px;

    margin-top:9px;

    border:0;
    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #16a34a
    );

    color:#fff;

    font-size:13px;
    font-weight:800;

    cursor:pointer;

    text-align:center;
    text-decoration:none;
}


/* INFO */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.info{
    padding:12px;
    background:rgba(255,255,255,.035);
    border-radius:12px;
}

.info-label{
    color:#718096;
    font-size:10px;
    margin-bottom:5px;
}

.info-value{
    color:#e8edf5;
    font-size:12px;
    font-weight:700;
}


/* MOBILE */

@media(max-width:360px){

    body{
        padding:13px;
    }

    .match-name{
        font-size:15px;
    }

    .status{
        font-size:9px;
        padding:5px 7px;
    }

}

</style>

</head>


<body>


<div class="container">

    <div class="header">

        </div>

    <!-- TABS -->

<!-- MATCH DETAILS MODAL -->

<div
    id="matchModal"

            <div class="room-row">

        <div class="info-grid">

            <div class="info">

                <div class="info-label">

                </div>

                <div
                    id="modalType"

            </div>


            <div class="info">

                <div class="info-label">

                </div>

                <div
                    id="modalDate"
                    class="info-value">

                </div>

            </div>


            <div class="info">

                <div class="info-label">
                    TIME
                </div>

                <div
                    id="modalTime"
                    class="info-value">

            </div>


            <div class="info">

                <div class="info-label">
                    MAP
                </div>

                <div
                    id="modalMap"

            </div>


            <div class="info">

                <div class="info-label">

                </div>

                <div
                    id="modalSlot"

                </div>

            </div>


            <div class="info">

                <div class="info-label">

                </div>

                <div
                    id="modalEntry"

                    --

                </div>

            </div>


            <div class="info">

                <div class="info-label">
                    STATUS
                </div>

                <div
                    id="modalStatus"
                    class="info-value">

                    --

                </div>

            </div>


        </div>


    </div>

</div>


<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

    authDomain:
        "incoinpaysliveearning.firebaseapp.com",

    databaseURL:
        "https://incoinpaysliveearning-default-rtdb.firebaseio.com",

    projectId:
        "incoinpaysliveearning",

    storageBucket:
        "incoinpaysliveearning.firebasestorage.app",

    messagingSenderId:
        "971873814750",

    appId:
        "1:971873814750:web:7418c7da119e4725ed9a4f"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);


const container =
    document.getElementById(
        "matchesContainer"
    );


const totalCount =
    document.getElementById(
        "totalCount"
    );


let allMatches = [];

let currentTab = "upcoming";

let selectedMatch = null;


/* AUTH */

onAuthStateChanged(
    auth,
    (user) => {


        if(!user){

            location.href =
                "index.html";

            return;

        }


        /*
         * USER MATCHES
         *
         * users
         *   UID
         *      matches
         *          MATCH_ID
         */

        const matchesRef =
            ref(
                db,
                "users/" +
                user.uid +
                "/matches"
            );


        onValue(
            matchesRef,
            (snapshot) => {


                allMatches = [];


                if(snapshot.exists()){


                    const data =
                        snapshot.val();


                    Object.keys(data)
                        .forEach(
                            (id) => {


                                const match =
                                    data[id] || {};


                                allMatches.push({

                                    id:id,

                                    ...match

                                });


                            }
                        );

                }


                /*
                 * Latest first
                 */

                allMatches.sort(
                    (a,b) => {


                        const aTime =
                            Number(
                                a.timestamp ||
                                a.joinedAt ||
                                0
                            );


                        const bTime =
                            Number(
                                b.timestamp ||
                                b.joinedAt ||
                                0
                            );


                        return bTime - aTime;

                    }
                );


                totalCount.innerText =
                    allMatches.length;


                renderMatches();

            }
        );


    }
);


/* TAB */

window.showTab =
function(tab){


    currentTab =
        tab;


    document
        .getElementById(
            "upcomingTab"
        )
        .classList.toggle(
            "active",
            tab === "upcoming"
        );


    document
        .getElementById(
            "playedTab"
        )
        .classList.toggle(
            "active",
            tab === "played"
        );


    renderMatches();

};


/* PLAYED CHECK */

function isPlayed(match){


    if(
        match.played === true ||
        match.played === "true"
    ){

        return true;

    }


    const status =
        String(
            match.status || ""
        ).toLowerCase();


    if(
        status === "completed" ||
        status === "played" ||
        status === "finished"
    ){

        return true;

    }


    if(
        match.matchPlayed === true ||
        match.matchPlayed === "true"
    ){

        return true;

    }


    return false;

}


/* RENDER */

function renderMatches(){


    container.innerHTML =
        "";


    const filtered =
        allMatches.filter(
            (match) => {


                const played =
                    isPlayed(match);


                if(
                    currentTab ===
                    "played"
                ){

                    return played;

                }


                return !played;

            }
        );


    if(
        filtered.length === 0
    ){


        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    ${
                        currentTab === "played"
                        ? "🎮"
                        : "🏆"
                    }

                </div>


                <div class="empty-title">

                    ${
                        currentTab === "played"
                        ? "No Played Matches"
                        : "No Upcoming Matches"
                    }

                </div>


                <div class="empty-text">

                    ${
                        currentTab === "played"
                        ? "Aapne abhi tak koi match complete nahi kiya."
                        : "Aapne abhi tak koi upcoming match join nahi kiya."
                    }

                </div>

            </div>

        `;


        return;

    }


    filtered.forEach(
        (match) => {


            container.appendChild(
                createMatchCard(match)
            );


        }
    );

}


/* CARD */

function createMatchCard(
    match
){


    const played =
        isPlayed(match);


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "match-card" +
        (
            played
            ? " played"
            : ""
        );


    const name =
        escapeHTML(
            match.name ||
            match.title ||
            match.matchName ||
            "BGMI Match"
        );


    const type =
        escapeHTML(
            match.type ||
            match.matchType ||
            "Match"
        );


    const date =
        escapeHTML(
            match.date ||
            match.matchDate ||
            "--"
        );


    const time =
        escapeHTML(
            match.time ||
            match.matchTime ||
            "--"
        );


    const room =
        escapeHTML(
            match.roomId ||
            match.room ||
            "--"
        );


    const map =
        escapeHTML(
            match.map ||
            "Erangel"
        );


    const slot =
        escapeHTML(
            String(
                match.slot ||
                match.slotNumber ||
                "--"
            )
        );


    const entry =
        escapeHTML(
            match.entryFee !==
            undefined
            ? "₹" +
              match.entryFee
            : "--"
        );


    card.innerHTML = `

        <div class="match-top">

            <div>

                <div class="match-name">
                    ${name}
                </div>

                <div class="match-type">
                    ${type}
                </div>

            </div>


            <div class="status ${
                played
                ? "played"
                : "upcoming"
            }">

                ${
                    played
                    ? "✓ PLAYED"
                    : "● UPCOMING"
                }

            </div>

        </div>


        <div class="details">


            <div class="detail">

                <div class="detail-label">
                    DATE
                </div>

                <div class="detail-value">
                    📅 ${date}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    TIME
                </div>

                <div class="detail-value">
                    ⏰ ${time}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    MAP
                </div>

                <div class="detail-value">
                    🗺️ ${map}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    ROOM ID
                </div>

                <div class="detail-value">
                    ${room}
                </div>

            </div>


        </div>


        <div class="slot-box">

            <div>

                <div class="slot-label">
                    YOUR SLOT
                </div>

                <div class="slot-value">
                    Slot ${slot}
                </div>

            </div>


            <div style="text-align:right;">

                <div class="slot-label">
                    ENTRY
                </div>

                <div
                    class="detail-value"
                    style="color:#22c55e;">

                    ${entry}

                </div>

            </div>

        </div>


        <div class="tap-text">

            Tap to view match details →

        </div>

    `;


    card.onclick =
        function(){

            openMatchDetails(
                match
            );

        };


    return card;

}


/* OPEN DETAILS */

window.openMatchDetails =
function(match){


    selectedMatch =
        match;


    const name =
        match.name ||
        match.title ||
        match.matchName ||
        "BGMI Match";


    const type =
        match.type ||
        match.matchType ||
        "Match";


    const date =
        match.date ||
        match.matchDate ||
        "--";


    const time =
        match.time ||
        match.matchTime ||
        "--";


    const map =
        match.map ||
        "Erangel";


    const slot =
        match.slot ||
        match.slotNumber ||
        "--";


    const entry =
        match.entryFee !==
        undefined
        ? "₹" +
          match.entryFee
        : "--";


    const roomId =
        match.roomId ||
        match.room ||
        "--";


    const password =
        match.password ||
        match.roomPassword ||
        match.pass ||
        "--";


    const status =
        isPlayed(match)
        ? "✓ Played"
        : "● Upcoming";


    document.getElementById(
        "modalTitle"
    ).innerText =
        name;


    document.getElementById(
        "modalSubtitle"
    ).innerText =
        "Match ID: " +
        match.id;


    document.getElementById(
        "modalRoomId"
    ).innerText =
        roomId;


    document.getElementById(
        "modalPassword"
    ).innerText =
        password;


    document.getElementById(
        "modalMatchName"
    ).innerText =
        name;


    document.getElementById(
        "modalType"
    ).innerText =
        type;


    document.getElementById(
        "modalDate"
    ).innerText =
        date;


    document.getElementById(
        "modalTime"
    ).innerText =
        time;


    document.getElementById(
        "modalMap"
    ).innerText =
        map;


    document.getElementById(
        "modalSlot"
    ).innerText =
        "Slot " + slot;


    document.getElementById(
        "modalEntry"
    ).innerText =
        entry;


    document.getElementById(
        "modalStatus"
    ).innerText =
        status;


    /*
     * Room link
     */

    const openBtn =
        document.getElementById(
            "openRoomBtn"
        );


    const roomLink =
        match.roomLink ||
        match.link ||
        match.joinLink ||
        "";


    if(
        roomLink &&
        !isPlayed(match)
    ){

        openBtn.href =
            roomLink;

        openBtn.style.display =
            "block";

    }else{

        openBtn.style.display =
            "none";

    }


    /*
     * Room section
     *
     * Played match me bhi
     * details visible rahenge,
     * lekin Open Room hide hoga.
     */

    document.getElementById(
        "roomSection"
    ).style.display =
        "block";


    document.getElementById(
        "matchModal"
    ).classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";

};


/* CLOSE */

window.closeModal =
function(){


    document.getElementById(
        "matchModal"
    ).classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";

};


window.closeOutside =
function(event){


    if(
        event.target.id ===
        "matchModal"
    ){

        closeModal();

    }

};


/* COPY */

window.copyRoomDetails =
async function(){


    if(!selectedMatch){
        return;
    }


    const roomId =
        selectedMatch.roomId ||
        selectedMatch.room ||
        "--";


    const password =
        selectedMatch.password ||
        selectedMatch.roomPassword ||
        selectedMatch.pass ||
        "--";


    const text =
        "Room ID: " +
        roomId +
        "\nPassword: " +
        password;


    try{


        await navigator.clipboard.writeText(
            text
        );


        document.getElementById(
            "copyRoomBtn"
        ).innerText =
            "✓ Copied";


        setTimeout(
            () => {

                document.getElementById(
                    "copyRoomBtn"
                ).innerText =
                    "📋 Copy Room ID & Password";

            },
            1500
        );


    }catch(error){

        alert(
            "Copy failed. Room ID: " +
            roomId +
            " | Password: " +
            password
        );

    }

};


/* ESCAPE HTML */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ESC KEY */

document.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key ===
            "Escape"
        ){

            closeModal();

        }

    }
);

</script>
