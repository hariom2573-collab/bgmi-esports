<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#050B18">

<title>BGMI ESPORTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    background:#050B18;
    color:#fff;

    overflow-x:hidden;

}

/* =========================
   BACKGROUND
========================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(34,197,94,.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(37,99,235,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(168,85,247,.12),
            transparent 35%
        );

    pointer-events:none;

    z-index:-2;

}

/* GRID EFFECT */

body::after{

    content:"";

    position:fixed;

    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    mask-image:linear-gradient(
        to bottom,
        black,
        transparent
    );

    pointer-events:none;

    z-index:-1;

}

/* =========================
   SPLASH
========================= */

#splash{

    position:fixed;

    inset:0;

    background:#050B18;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:9999;

}

.splashLogo{

    width:90px;
    height:90px;

    border-radius:26px;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:42px;

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #22c55e
        );

    box-shadow:
        0 0 25px rgba(34,197,94,.35),
        0 20px 50px rgba(0,0,0,.5);

    animation:
        splashPulse 1.2s infinite alternate;

}

.splashTitle{

    margin-top:20px;

    font-size:24px;

    font-weight:800;

    letter-spacing:1px;

}

.splashSub{

    margin-top:5px;

    color:#94a3b8;

    font-size:12px;

    letter-spacing:2px;

}

.loaderDots{

    display:flex;

    gap:6px;

    margin-top:25px;

}

.loaderDots span{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#22c55e;

    animation:dot 1s infinite;

}

.loaderDots span:nth-child(2){
    animation-delay:.15s;
}

.loaderDots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes splashPulse{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.06);
    }

}

@keyframes dot{

    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-5px);
    }

}

/* =========================
   MAIN
========================= */

#mainContainer{

    width:100%;

    min-height:100vh;

    display:none;

    justify-content:center;

    align-items:center;

    padding:25px 16px;

}

.app{

    width:100%;

    max-width:430px;

}

/* =========================
   BRAND
========================= */

.brand{

    text-align:center;

    margin-bottom:25px;

}

.brandLogo{

    width:68px;
    height:68px;

    margin:auto;

    border-radius:20px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:30px;

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #22c55e
        );

    box-shadow:
        0 10px 30px rgba(34,197,94,.25);

}

.brand h1{

    margin-top:14px;

    font-size:24px;

    font-weight:800;

    letter-spacing:.5px;

}

.brand p{

    margin-top:4px;

    color:#94a3b8;

    font-size:12px;

}

/* =========================
   CARD
========================= */

.card{

    background:
        linear-gradient(
            180deg,
            rgba(17,24,39,.96),
            rgba(10,15,28,.98)
        );

    border:1px solid rgba(255,255,255,.08);

    border-radius:25px;

    padding:24px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.04);

    backdrop-filter:blur(15px);

}

/* TOP BADGE */

.topBadge{

    width:max-content;

    margin:0 auto 18px;

    padding:7px 13px;

    border-radius:999px;

    background:rgba(34,197,94,.10);

    border:1px solid rgba(34,197,94,.20);

    color:#4ade80;

    font-size:10px;

    font-weight:700;

    letter-spacing:1px;

}

/* TITLE */

.title{

    text-align:center;

    font-size:23px;

    font-weight:800;

}

.subtitle{

    text-align:center;

    margin-top:5px;

    margin-bottom:22px;

    color:#94a3b8;

    font-size:13px;

}

/* =========================
   INPUT
========================= */

.inputGroup{

    position:relative;

    margin-top:13px;

}

.inputIcon{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    font-size:17px;

    opacity:.75;

}

input{

    width:100%;

    height:53px;

    padding:
        0 48px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.08);

    outline:none;

    background:#0b1220;

    color:#fff;

    font-size:14px;

    transition:.2s;

}

input::placeholder{

    color:#64748b;

}

input:focus{

    border-color:#22c55e;

    box-shadow:
        0 0 0 3px rgba(34,197,94,.08);

}

/* PASSWORD EYE */

.passwordToggle{

    position:absolute;

    right:12px;

    top:50%;

    transform:translateY(-50%);

    width:36px;
    height:36px;

    border:0;

    background:transparent;

    color:#94a3b8;

    cursor:pointer;

    font-size:17px;

}

/* =========================
   BUTTON
========================= */

button{

    font-family:inherit;

}

#loginBtn,
#registerBtn{

    width:100%;

    height:54px;

    border:0;

    border-radius:14px;

    margin-top:18px;

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #22c55e
        );

    color:#031207;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 12px 25px rgba(34,197,94,.18);

    transition:.2s;

}

#loginBtn:active,
#registerBtn:active{

    transform:scale(.98);

}

#loginBtn:disabled,
#registerBtn:disabled{

    opacity:.6;

    cursor:not-allowed;

}

/* =========================
   FORGOT
========================= */

.link{

    text-align:center;

    margin-top:16px;

    color:#94a3b8;

    font-size:12px;

}

.link span{

    color:#4ade80;

    font-weight:700;

    cursor:pointer;

}

#forgotBox{

    cursor:pointer;

    color:#60a5fa;

}

/* =========================
   MESSAGE
========================= */

#message{

    min-height:20px;

    margin-top:14px;

    text-align:center;

    font-size:12px;

    line-height:1.5;

}

.error{

    color:#f87171;

}

.success{

    color:#4ade80;

}

/* =========================
   DIVIDER
========================= */

.divider{

    display:flex;

    align-items:center;

    gap:10px;

    margin:20px 0;

    color:#475569;

    font-size:10px;

}

.divider::before,
.divider::after{

    content:"";

    height:1px;

    flex:1;

    background:#ffffff10;

}

/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    margin-top:18px;

    color:#64748b;

    font-size:10px;

}

.footer b{

    color:#22c55e;

}

/* =========================
   MOBILE
========================= */

@media(max-width:360px){

    #mainContainer{

        padding:18px 12px;

    }

    .card{

        padding:20px;

    }

    .brand h1{

        font-size:21px;

    }

}

/* =========================
   HIDE DESKTOP FEEL
========================= */

@media(min-width:700px){

    body{

        background:#030712;

    }

    #mainContainer{

        max-width:100%;

    }

}

</style>

</head>

<body>

<!-- =========================
     SPLASH
========================= -->

<div id="splash">

<div class="splashLogo">
    🎮
</div>

<div class="splashTitle">
    BGMI ESPORTS
</div>

<div class="splashSub">
    PREMIUM GAMING EXPERIENCE
</div>

<div class="loaderDots">

    <span></span>
    <span></span>
    <span></span>

</div>

</div>

<!-- =========================
     MAIN
========================= -->

<div id="mainContainer">

<div class="app">

<!-- BRAND -->

<div class="brand">

    <div class="brandLogo">
        🎮
    </div>

    <h1>
        BGMI ESPORTS
    </h1>

    <p>
        Play • Compete • Win
    </p>

</div>


<!-- CARD -->

<div class="card">


    <div class="topBadge">
        🔥 PREMIUM TOURNAMENT PLATFORM
    </div>


    <div
        class="title"
        id="formTitle">

        Welcome Back

    </div>


    <div
        class="subtitle"
        id="formSubTitle">

        Login to continue

    </div>


    <!-- NAME -->

    <div
        class="inputGroup"
        id="nameGroup"
        style="display:none;">

        <span class="inputIcon">
            👤
        </span>

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            autocomplete="name">

    </div>


    <!-- EMAIL -->

    <div class="inputGroup">

        <span class="inputIcon">
            ✉️
        </span>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email">

    </div>


    <!-- PASSWORD -->

    <div class="inputGroup">

        <span class="inputIcon">
            🔐
        </span>

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password">

        <button
            type="button"
            class="passwordToggle"
            id="passwordToggle"
            onclick="togglePassword('password','passwordToggle')">

            👁️

        </button>

    </div>


    <!-- CONFIRM -->

    <div
        class="inputGroup"
        id="confirmGroup"
        style="display:none;">

        <span class="inputIcon">
            🔒
        </span>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            autocomplete="new-password">

        <button
            type="button"
            class="passwordToggle"
            id="confirmToggle"
            onclick="togglePassword('confirmPassword','confirmToggle')">

            👁️

        </button>

    </div>


    <!-- LOGIN -->

    <button
        id="loginBtn"
        onclick="loginUser()">

        LOGIN 🚀

    </button>


    <!-- REGISTER -->

    <button
        id="registerBtn"
        onclick="registerUser()"
        style="display:none;">

        CREATE ACCOUNT 🎮

    </button>


    <!-- FORGOT -->

    <div
        id="forgotBox"
        class="link"
        onclick="forgotPassword()">

        Forgot Password?

    </div>


    <div class="divider">
        ACCOUNT
    </div>


    <!-- SWITCH -->

    <div
        id="switchBox"
        class="link">

        Don't have an account?

        <span onclick="location.href='register.html'">
    Register
</span>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="error">

    </div>


</div>


<div class="footer">

    Secure login powered by
    <b>Firebase</b>

</div>

</div>

</div>

<script>

/* =========================
   SPLASH
========================= */

setTimeout(() => {

    const splash =
        document.getElementById("splash");

    const main =
        document.getElementById("mainContainer");

    if(splash){

        splash.style.display = "none";

    }

    if(main){

        main.style.display = "flex";

    }

},1500);

/* =========================
   SHOW LOGIN
========================= */

window.showLogin = function(){

    document.getElementById(
        "formTitle"
    ).innerText =
        "Welcome Back";

    document.getElementById(
        "formSubTitle"
    ).innerText =
        "Login to continue";

    document.getElementById(
        "nameGroup"
    ).style.display =
        "none";

    document.getElementById(
        "confirmGroup"
    ).style.display =
        "none";

    document.getElementById(
        "loginBtn"
    ).style.display =
        "block";

    document.getElementById(
        "registerBtn"
    ).style.display =
        "none";

    document.getElementById(
        "forgotBox"
    ).style.display =
        "block";

    document.getElementById(
        "password"
    ).autocomplete =
        "current-password";

    document.getElementById(
        "switchBox"
    ).innerHTML =
        "Don't have an account? " +
        '<span onclick="showRegister()">Register</span>';

    clearMessage();

};


/* =========================
   PASSWORD TOGGLE
========================= */

window.togglePassword = function(
    inputId,
    buttonId
){

    const input =
        document.getElementById(
            inputId
        );

    const button =
        document.getElementById(
            buttonId
        );

    if(input.type === "password"){

        input.type = "text";

        button.innerText = "🙈";

    }else{

        input.type = "password";

        button.innerText = "👁️";

    }

};


/* =========================
   MESSAGE
========================= */

function clearMessage(){

    const msg =
        document.getElementById(
            "message"
        );

    msg.innerText = "";

    msg.className = "error";

}

function showError(text){

    const msg =
        document.getElementById(
            "message"
        );

    msg.className = "error";

    msg.innerText = text;

}

function showSuccess(text){

    const msg =
        document.getElementById(
            "message"
        );

    msg.className = "success";

    msg.innerText = text;

}


/* =========================
   FIREBASE ERROR
========================= */

function friendlyError(error){

    const code =
        error?.code || "";

    switch(code){

        case "auth/invalid-credential":
            return "Invalid email or password.";

        case "auth/invalid-email":
            return "Please enter a valid email address.";

        case "auth/user-not-found":
            return "Account not found.";

        case "auth/wrong-password":
            return "Incorrect password.";

        case "auth/email-already-in-use":
            return "This email is already registered.";

        case "auth/weak-password":
            return "Password should be at least 6 characters.";

        case "auth/too-many-requests":
            return "Too many attempts. Please try again later.";

        case "auth/network-request-failed":
            return "Network error. Check your internet connection.";

        default:
            return error?.message ||
                   "Something went wrong.";

    }

}

</script>

<!-- ==========================
     FIREBASE
========================== -->

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

    getAuth,

    onAuthStateChanged,

    signInWithEmailAndPassword,

    createUserWithEmailAndPassword,

    sendPasswordResetEmail,

    updateProfile

} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {

    getDatabase,

    ref,

    set

} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* ==========================
   FIREBASE CONFIG
========================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

    authDomain:
        "incoinpaysliveearning.firebaseapp.com",

    databaseURL:
        "https://incoinpaysliveearning-default-rtdb.firebaseio.com",

    projectId:
        "incoinpaysliveearning",

    storageBucket:
        "incoinpaysliveearning.firebasestorage.app",

    messagingSenderId:
        "971873814750",

    appId:
        "1:971873814750:web:7418c7da119e4725ed9a4f"

};


/* ==========================
   INITIALIZE
========================== */

const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* ==========================
   AUTO LOGIN
========================== */

let redirecting = false;

onAuthStateChanged(
    auth,
    (user) => {

        if(
            user &&
            !redirecting
        ){

            redirecting = true;

            location.replace(
                "dashboard.html"
            );

        }

    }
);


/* ==========================
   LOGIN
========================== */

window.loginUser =
async function(){

    if(redirecting){
        return;
    }

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const button =
        document.getElementById(
            "loginBtn"
        );


    clearMessage();


    if(
        email === "" ||
        password === ""
    ){

        showError(
            "Please enter email and password."
        );

        return;

    }


    button.disabled = true;

    button.innerText =
        "LOGGING IN...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        showSuccess(
            "Login successful. Opening dashboard..."
        );

        redirecting = true;

        setTimeout(
            () => {

                location.replace(
                    "dashboard.html"
                );

            },
            500
        );


    }catch(error){

        console.error(
            "Login Error:",
            error
        );

        showError(
            friendlyError(error)
        );

        button.disabled = false;

        button.innerText =
            "LOGIN 🚀";

    }

};


/* ==========================
   REGISTER
========================== */

window.registerUser =
async function(){

    if(redirecting){
        return;
    }


    const name =
        document.getElementById(
            "name"
        ).value.trim();

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const confirm =
        document.getElementById(
            "confirmPassword"
        ).value;

    const button =
        document.getElementById(
            "registerBtn"
        );


    clearMessage();


    if(
        name === "" ||
        email === "" ||
        password === "" ||
        confirm === ""
    ){

        showError(
            "Please fill all fields."
        );

        return;

    }


    if(name.length < 2){

        showError(
            "Please enter a valid name."
        );

        return;

    }


    if(password.length < 6){

        showError(
            "Password must be at least 6 characters."
        );

        return;

    }


    if(password !== confirm){

        showError(
            "Passwords do not match."
        );

        return;

    }


    button.disabled = true;

    button.innerText =
        "CREATING ACCOUNT...";


    try{


        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        /* AUTH PROFILE */

        await updateProfile(
            user,
            {
                displayName:name
            }
        );


        /* DATABASE PROFILE */

        await set(
            ref(
                db,
                "users/" + user.uid
            ),
            {

                uid:
                    user.uid,

                name:
                    name,

                email:
                    email,

                wallet:
                    0,

                winning:
                    0,

                deposit:
                    0,

                bonus:
                    0,

                matchCount:
                    0,

                matchesJoined:
                    0,

                photo:
                    "https://i.imgur.com/6VBx3io.png",

                premium:
                    false,

                createdAt:
                    Date.now()

            }
        );


        showSuccess(
            "Account created successfully!"
        );


        redirecting = true;


        setTimeout(
            () => {

                location.replace(
                    "dashboard.html"
                );

            },
            700
        );


    }catch(error){

        console.error(
            "Register Error:",
            error
        );

        showError(
            friendlyError(error)
        );

        button.disabled = false;

        button.innerText =
            "CREATE ACCOUNT 🎮";

    }

};


/* ==========================
   FORGOT PASSWORD
========================== */

window.forgotPassword =
async function(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    clearMessage();


    if(email === ""){

        showError(
            "Enter your email first."
        );

        return;

    }


    try{

        await sendPasswordResetEmail(
            auth,
            email
        );

        showSuccess(
            "Password reset email sent. Check your inbox."
        );

    }catch(error){

        console.error(
            "Reset Error:",
            error
        );

        showError(
            friendlyError(error)
        );

    }

};


/* ==========================
   ENTER KEY
========================== */

document.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            const registerVisible =
                document.getElementById(
                    "registerBtn"
                ).style.display !== "none";


            if(registerVisible){

                registerUser();

            }else{

                loginUser();

            }

        }

    }
);

</script>

</body>

</html>
