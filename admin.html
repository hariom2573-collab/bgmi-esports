<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050B18;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

.box{
width:90%;
max-width:400px;
background:#111827;
padding:25px;
border-radius:20px;
}

h2{
text-align:center;
margin-bottom:20px;
color:#22c55e;
}

input{
width:100%;
height:50px;
margin-bottom:15px;
padding:0 15px;
background:#1f2937;
border:none;
border-radius:10px;
color:#fff;
font-size:15px;
}

button{
width:100%;
height:50px;
background:#22c55e;
border:none;
border-radius:10px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

#msg{
margin-top:15px;
text-align:center;
color:#f87171;
}
</style>
</head>

<body>

<div class="box">

<h2>BGMI Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
LOGIN
</button>

<div id="msg"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={

apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",
authDomain:"incoinpaysliveearning.firebaseapp.com",
databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",
projectId:"incoinpaysliveearning",
storageBucket:"incoinpaysliveearning.firebasestorage.app",
messagingSenderId:"971873814750",
appId:"1:971873814750:web:7418c7da119e4725ed9a4f"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const ADMIN_UID="VIAP56vYwndWPhJxktn0lRPTWnS2";

document.getElementById("loginBtn").onclick=async()=>{

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value.trim();

if(!email || !password){

document.getElementById("msg").innerHTML="Enter Email & Password";

return;

}

try{

const result=await signInWithEmailAndPassword(
auth,
email,
password
);

if(result.user.uid!==ADMIN_UID){

await auth.signOut();

document.getElementById("msg").innerHTML="Access Denied";

return;

}

location.href="admin-dashboard.html";

}catch(e){

document.getElementById("msg").innerHTML=e.message;

}

};

</script>

</body>
</html>
