<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:#050B18;
}

body{
    background:
    radial-gradient(circle at top right,#102a22 0%,transparent 35%),
    radial-gradient(circle at bottom left,#111b35 0%,transparent 35%),
    #050B18;

    color:#fff;
    min-height:100vh;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    max-width:560px;
    margin:auto;
    padding:14px;
    padding-bottom:40px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:relative;

    padding:20px;

    border-radius:24px;

    background:
    linear-gradient(
        145deg,
        rgba(20,34,55,.98),
        rgba(10,18,31,.98)
    );

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 20px 50px rgba(0,0,0,.35);

    overflow:hidden;
}

.header::before{
    content:"";
    position:absolute;

    width:180px;
    height:180px;

    right:-80px;
    top:-90px;

    background:#22c55e;

    opacity:.08;

    border-radius:50%;
}

.headerTop{
    position:relative;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:10px;
}

.headerTitle{
    font-size:22px;
    font-weight:800;
    letter-spacing:.2px;
}

.headerSub{
    margin-top:4px;

    font-size:11px;
    color:#94a3b8;
}

.adminBadge{
    display:flex;
    align-items:center;
    gap:6px;

    padding:7px 10px;

    border-radius:20px;

    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.22);

    color:#22c55e;

    font-size:10px;
    font-weight:800;
}

.adminDot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:0 0 10px #22c55e;
}


/* =====================================================
   HEADER ACTIONS
===================================================== */

.headerActions{
    display:flex;
    gap:9px;

    margin-top:18px;
}

.headerBtn{
    flex:1;

    height:42px;

    border:none;
    border-radius:12px;

    color:#fff;

    background:#172235;

    border:1px solid rgba(255,255,255,.07);

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

.headerBtn:active{
    transform:scale(.98);
}

.logoutBtn{
    color:#f87171;
    background:rgba(239,68,68,.08);
    border-color:rgba(239,68,68,.15);
}


/* =====================================================
   STATS
===================================================== */

.stats{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:8px;

    margin-top:14px;
}

.stat{

    padding:13px 7px;

    text-align:center;

    border-radius:16px;

    background:#0d1728;

    border:1px solid rgba(255,255,255,.06);
}

.statIcon{

}

.statNumber{
    margin-top:5px;

}

.statLabel{
    margin-top:2px;

    color:#64748b;

    font-size:8px;
    font-weight:700;

}

.green{
    color:#22c55e;
}

.blue{
    color:#38bdf8;
}

.orange{
    color:#fb923c;
}

.purple{
    color:#c084fc;
}

.red{
    color:#ef4444;
}


/* =====================================================
   SEARCH
===================================================== */

.tools{
    margin-top:14px;

    padding:13px;

    border-radius:18px;

    background:#0d1728;

    border:1px solid rgba(255,255,255,.06);
}

.searchBox{
    position:relative;
}

.searchBox input{
    width:100%;
    height:45px;

    outline:none;

    border-radius:12px;

    background:#111d30;

    color:#fff;

    border:1px solid rgba(255,255,255,.06);

}

.searchBox input::placeholder{
    color:#64748b;
}

.searchIcon{

    left:14px;
    top:12px;

    font-size:17px;

}

.filters{

    gap:7px;

    margin-top:10px;

    overflow-x:auto;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filterBtn{
    flex-shrink:0;

    height:34px;

    padding:0 13px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.06);

    background:#111d30;

    color:#94a3b8;

    font-size:10px;
    font-weight:700;
}

.filterBtn.active{
    color:#03130a;

    background:#22c55e;

    border-color:#22c55e;
}


/* =====================================================
   SECTION HEADER
===================================================== */

.sectionHead{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin:18px 2px 10px;
}

.sectionTitle{
    font-size:14px;
    font-weight:800;
}

.resultCount{
    color:#64748b;
    font-size:10px;
}


/* =====================================================
   TOURNAMENT CARD
===================================================== */

.tournament{
    position:relative;

    margin-bottom:12px;

    padding:16px;

    border-radius:20px;

    background:
    linear-gradient(
        145deg,
        rgba(17,29,48,.98),
        rgba(10,19,33,.98)
    );

    border:1px solid rgba(255,255,255,.07);

    box-shadow:
    0 12px 30px rgba(0,0,0,.20);

    overflow:hidden;
}

.tournament.liveCard{
    border-color:rgba(34,197,94,.25);
}

.tournament.liveCard::before{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:2px;

    background:#22c55e;

    box-shadow:0 0 14px #22c55e;
}


/* =====================================================
   CARD TOP
===================================================== */

.cardTop{
    display:flex;

    align-items:flex-start;

    gap:10px;
}

.cardTitleWrap{

}

.cardTitle{

.status-live{

.status-completed{

===================================================== */

.infoGrid{

.infoLabel{

.infoValue.slots{

/* =====================================================

===================================================== */

.progressHead{

.progress{

    background:#172235;
}

.progressBar{

    background:#22c55e;

/* =====================================================

===================================================== */

.liveBox{

    font-weight:800;
}


/* =====================================================

===================================================== */

.editBox{

    padding:12px;

    background:#0b1424;

    border:1px solid rgba(255,255,255,.05);
}

.editLabel{

    font-size:9px;
    font-weight:700;
}

.statusSelect{

    height:42px;

    border:none;
    outline:none;

    color:#fff;

    font-size:11px;
    font-weight:700;
}

.editRoomInput{

    height:42px;

    margin-top:8px;

    outline:none;

    border-radius:10px;

    color:#fff;

}


/* =====================================================

===================================================== */

.actions{
    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:8px;

    margin-top:11px;
}

.actionBtn{
    height:42px;

    border:none;

    border-radius:11px;

    font-size:10px;
    font-weight:800;

    cursor:pointer;
}

.saveBtn{
    background:#22c55e;
    color:#03130a;
}

.deleteBtn{
    background:rgba(239,68,68,.10);

    color:#f87171;

    border:1px solid rgba(239,68,68,.15);
}

.actionBtn:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
    padding:45px 20px;

    text-align:center;

    border-radius:20px;

    background:#0d1728;

    border:1px solid rgba(255,255,255,.06);
}

.emptyIcon{
    font-size:35px;
}

.emptyTitle{
    margin-top:10px;

    font-size:15px;
    font-weight:800;
}

.emptyText{
    margin-top:4px;

    color:#64748b;

    font-size:10px;
}


/* =====================================================
   LOADER
===================================================== */

.loader{
    padding:45px 20px;

    text-align:center;

    border-radius:20px;

    background:#0d1728;

    color:#94a3b8;

    font-size:11px;
}

.spinner{
    width:28px;
    height:28px;

    margin:0 auto 12px;

    border:3px solid #1e293b;

    border-top-color:#22c55e;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    left:50%;
    bottom:22px;

    z-index:9999;

    transform:
    translate(-50%,20px);

    width:calc(100% - 30px);
    max-width:430px;

    padding:13px 16px;

    border-radius:13px;

    background:#111827;

    border:1px solid rgba(34,197,94,.25);

    color:#fff;

    text-align:center;

    font-size:11px;
    font-weight:700;

    box-shadow:
    0 15px 40px rgba(0,0,0,.45);

    opacity:0;

    pointer-events:none;

    transition:
    .25s ease;
}

.toast.show{
    opacity:1;

    transform:
    translate(-50%,0);
}

.toast.error{
    border-color:rgba(239,68,68,.30);
}


/* =====================================================
   DESKTOP BLOCK
===================================================== */

@media(min-width:700px){

        background:#050B18;

        color:#22c55e;

        font-size:20px;
        font-weight:800;

        z-index:100000;
    }

    .app{
        display:none;
    }

}

</style>

<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue,
    update,
    remove
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

    authDomain:
    "incoinpaysliveearning.firebaseapp.com",

    databaseURL:
    "https://incoinpaysliveearning-default-rtdb.firebaseio.com",

    projectId:
    "incoinpaysliveearning",

    storageBucket:
    "incoinpaysliveearning.firebasestorage.app",

    messagingSenderId:
    "971873814750",

    appId:
    "1:971873814750:web:7418c7da119e4725ed9a4f"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);


/* =====================================================
   ADMIN
===================================================== */

const ADMIN_UID =
"VIAP56vYwndWPhJxktn0lRPTWnS2";


/* =====================================================
   DOM
===================================================== */

const list =
document.getElementById(
    "tournamentList"
);

const searchInput =
document.getElementById(
    "searchInput"
);

const resultCount =
document.getElementById(
    "resultCount"
);

const toast =
document.getElementById(
    "toast"
);


/* =====================================================
   STATE
===================================================== */

let allTournaments = [];

let currentFilter = "all";

let databaseListener = null;

const processing =
new Set();


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    (user) => {

        if(!user){

            location.replace(
                "index.html"
            );

            return;
        }


        if(user.uid !== ADMIN_UID){

            showToast(
                "Access Denied",
                true
            );

            setTimeout(
                () => {

                    location.replace(
                        "index.html"
                    );

                },
                800
            );

            return;
        }


        loadTournaments();

    }
);


/* =====================================================
   LOAD
===================================================== */

function loadTournaments(){

    if(databaseListener){
        return;
    }


    databaseListener =
    onValue(

        ref(db,"matches"),

        (snapshot) => {

            allTournaments = [];


            if(snapshot.exists()){

                snapshot.forEach(
                    (item) => {

                        allTournaments.push({

                            id:item.key,

                            ...(item.val() || {})

                        });

                    }
                );

            }


            allTournaments.sort(
                (a,b) => {

                    const ta =
                    Number(
                        a.createdAt ||
                        a.timestamp ||
                        0
                    );

                    const tb =
                    Number(
                        b.createdAt ||
                        b.timestamp ||
                        0
                    );

                    return tb - ta;

                }
            );


            updateStats();

            render();

        },

        (error) => {

            console.error(
                error
            );

            list.innerHTML = `

                <div class="empty">

                    <div class="emptyIcon">
                        ⚠️
                    </div>

                    <div class="emptyTitle">
                        Firebase Error
                    </div>

                    <div class="emptyText">
                        ${escapeHTML(error.message)}
                    </div>

                </div>

            `;

            showToast(
                "Firebase load failed",
                true
            );

        }

    );

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    let total = 0;
    let upcoming = 0;
    let live = 0;
    let completed = 0;


    allTournaments.forEach(
        (item) => {

            total++;

            const status =
            normalizeStatus(
                item.status
            );


            if(status === "upcoming"){
                upcoming++;
            }

            else if(status === "live"){
                live++;
            }

            else if(
                status === "completed"
            ){

                completed++;

            }

        }
    );


    setText(
        "totalCount",
        total
    );

    setText(
        "upcomingCount",
        upcoming
    );

    setText(
        "liveCount",
        live
    );

    setText(
        "completedCount",
        completed
    );

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const query =
    String(
        searchInput.value || ""
    )
    .trim()
    .toLowerCase();


    const filtered =
    allTournaments.filter(
        (item) => {

            const status =
            normalizeStatus(
                item.status
            );


            const title =
            String(
                item.title ||
                item.name ||
                item.matchName ||
                ""
            ).toLowerCase();


            const type =
            String(
                item.type || ""
            ).toLowerCase();


            const matchesSearch =
            !query ||
            title.includes(query) ||
            type.includes(query) ||
            String(item.id)
            .toLowerCase()
            .includes(query);


            const matchesFilter =
            currentFilter === "all" ||
            status === currentFilter;


            return (
                matchesSearch &&
                matchesFilter
            );

        }
    );


    resultCount.innerText =
    filtered.length +
    (
        filtered.length === 1
        ? " match"
        : " matches"
    );


    if(filtered.length === 0){

        list.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    🔍
                </div>

                <div class="emptyTitle">
                    No Tournament Found
                </div>

                <div class="emptyText">
                    Try another search or filter.
                </div>

            </div>

        `;

        return;
    }


    list.innerHTML = "";


    filtered.forEach(
        (item) => {

            list.insertAdjacentHTML(
                "beforeend",
                createTournamentHTML(item)
            );

        }
    );

}

/* =====================================================
   SAVE
===================================================== */

async function saveTournament(id){

    if(processing.has(id)){
        return;
    }


    const statusElement =
    document.getElementById(
        "status_" + id
    );


    const groupElement =
    document.getElementById(
        "group_" + id
    );


    if(!statusElement){
        return;
    }


    const status =
    normalizeStatus(
        statusElement.value
    );


    const groupLink =
    groupElement
    ? groupElement.value.trim()
    : "";


    const tournament =
    allTournaments.find(
        item => item.id === id
    );


    if(!tournament){

        showToast(
            "Tournament not found",
            true
        );

        return;
    }


    processing.add(id);


    const button =
    document.querySelector(
        `[data-save="${cssEscape(id)}"]`
    );


    if(button){

        button.disabled = true;

        button.innerText =
        "Saving...";

    }


    try{

        const updateData = {

            status:status,

            groupLink:groupLink,

            updatedAt:Date.now()

        };


        /*
           LIVE start time only when
           changing into LIVE.
        */

        const oldStatus =
        normalizeStatus(
            tournament.status
        );


        if(
            status === "live" &&
            oldStatus !== "live"
        ){

            updateData.liveAt =
            Date.now();

        }


        /*
           Remove liveAt after leaving LIVE.
        */

        if(
            status !== "live"
        ){

            updateData.liveAt =
            null;

        }


        await update(
            ref(
                db,
                "matches/" + id
            ),
            updateData
        );


        showToast(
            "Tournament updated successfully"
        );

    }
    catch(error){

        console.error(
            "Save error:",
            error
        );

        showToast(
            error.message ||
            "Update failed",
            true
        );

    }
    finally{

        processing.delete(id);

        if(button){

            button.disabled = false;

            button.innerText =
            "💾 Save Changes";

        }

    }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteTournament(id){

    if(processing.has(id)){
        return;
    }


    const tournament =
    allTournaments.find(
        item => item.id === id
    );


    const title =
    tournament
    ? (
        tournament.title ||
        tournament.name ||
        "this tournament"
    )
    : "this tournament";


    const confirmed =
    confirm(
        `Delete "${title}"?\n\nThis action cannot be undone.`
    );


    if(!confirmed){
        return;
    }


    processing.add(id);


    const button =
    document.querySelector(
        `[data-delete="${cssEscape(id)}"]`
    );


    if(button){

        button.disabled = true;

        button.innerText =
        "Deleting...";

    }


    try{

        await remove(
            ref(
                db,
                "matches/" + id
            )
        );


        showToast(
            "Tournament deleted"
        );

    }
    catch(error){

        console.error(
            "Delete error:",
            error
        );

        showToast(
            error.message ||
            "Delete failed",
            true
        );

    }
    finally{

        processing.delete(id);

    }

}


/* =====================================================
   COPY LINK
===================================================== */

async function copyLink(link){

    if(!link){
        return;
    }


    try{

        if(
            navigator.clipboard &&
            window.isSecureContext
        ){

            await navigator.clipboard.writeText(
                link
            );

        }
        else{

            const input =
            document.createElement(
                "textarea"
            );

            input.value = link;

            input.style.position =
            "fixed";

            input.style.opacity =
            "0";

            document.body.appendChild(
                input
            );

            input.focus();

            input.select();

            document.execCommand(
                "copy"
            );

            input.remove();

        }


        showToast(
            "Link copied"
        );

    }
    catch(error){

        showToast(
            "Copy failed",
            true
        );

    }

}

/* =====================================================
   LIVE TIMER
===================================================== */

setInterval(
    () => {

        document
        .querySelectorAll(
            "[data-live-at]"
        )
        .forEach(
            (element) => {

                const liveAt =
                Number(
                    element.dataset.liveAt
                );


                if(!liveAt){
                    return;
                }


                const diff =
                Math.max(
                    0,
                    Date.now() - liveAt
                );


                const totalSeconds =
                Math.floor(
                    diff / 1000
                );


                const hours =
                Math.floor(
                    totalSeconds / 3600
                );


                const minutes =
                Math.floor(
                    (
                        totalSeconds % 3600
                    ) / 60
                );


                const seconds =
                totalSeconds % 60;


                element.innerText =
                `🔥 LIVE • ${
                    String(hours).padStart(2,"0")
                }:${
                    String(minutes).padStart(2,"0")
                }:${
                    String(seconds).padStart(2,"0")
                }`;

            }
        );

    },
    1000
);


/* =====================================================
   HELPERS
===================================================== */

function normalizeStatus(value){

    const status =
    String(
        value || "upcoming"
    ).toLowerCase();


    if(
        status === "live"
    ){
        return "live";
    }


    if(
        status === "completed" ||
        status === "finished" ||
        status === "played"
    ){

        return "completed";

    }


    if(
        status === "closed"
    ){

        return "closed";

    }


    return "upcoming";

}


function statusLabel(status){

    const labels = {

        upcoming:"⏳ UPCOMING",

        live:"🔥 LIVE",

        completed:"✅ COMPLETED",

        closed:"🔒 CLOSED"

    };


    return (
        labels[status] ||
        "⏳ UPCOMING"
    );

}


function getPrize(data){

    if(
        data.prize !== undefined &&
        data.prize !== null
    ){

        return Number(
            data.prize || 0
        );

    }


    if(
        data.winningAmount !== undefined
    ){

        return Number(
            data.winningAmount || 0
        );

    }


    return (
        Number(data.firstPrize || 0) +
        Number(data.secondPrize || 0) +
        Number(data.thirdPrize || 0)
    );

}


function formatMoney(value){

    const number =
    Number(value || 0);


    if(
        !Number.isFinite(number)
    ){

        return "0";

    }


    return number.toLocaleString(
        "en-IN",
        {
            maximumFractionDigits:0
        }
    );

}


function formatDate(value){

    if(!value){
        return "Date not set";
    }


    try{

        const date =
        new Date(
            value + "T00:00:00"
        );


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return String(value);

        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        );

    }
    catch{

        return String(value);

    }

}


function formatClock(value){

    if(!value){
        return "Time not set";
    }


    const parts =
    String(value).split(":");


    if(
        parts.length < 2
    ){

        return String(value);

    }


    let hour =
    Number(parts[0]);

    const minute =
    parts[1];


    if(
        !Number.isFinite(hour)
    ){

        return String(value);

    }


    const suffix =
    hour >= 12
    ? "PM"
    : "AM";


    hour =
    hour % 12 || 12;


    return (
        String(hour) +
        ":" +
        minute +
        " " +
        suffix
    );

}


function setText(
    id,
    value
){

    const element =
    document.getElementById(id);


    if(element){

        element.innerText =
        value;

    }

}


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeAttr(value){

    return escapeHTML(
        value
    );

}


/*
   Used only for querySelector
   with dynamically generated IDs.
*/

function cssEscape(value){

    if(
        window.CSS &&
        CSS.escape
    ){

        return CSS.escape(
            String(value)
        );

    }


    return String(value)
    .replace(
        /([^\w-])/g,
        "\\$1"
    );

}


/* =====================================================
   INITIAL TOAST
===================================================== */

function showToast(
    message,
    error = false
){

    toast.innerText =
    message;


    toast.classList.toggle(
        "error",
        error
    );


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.__toastTimer
    );


    window.__toastTimer =
    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}
