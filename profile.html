<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#07111d">

<title>My Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:#07111d;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

body::-webkit-scrollbar{
    display:none;
}

/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top left,#22c55e22,transparent 35%),
        radial-gradient(circle at top right,#2563eb20,transparent 35%),
        #07111d;
    z-index:-1;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:14px;
}

/* =========================
   TOP BROADCAST TICKER
========================= */

.ticker{
    display:none;
    width:100%;
    height:44px;
    margin-bottom:14px;
    background:#111827;
    border:1px solid #22c55e30;
    border-radius:15px;
    overflow:hidden;
    align-items:center;
    box-shadow:0 8px 25px #0005;
}

.ticker-icon{
    flex-shrink:0;
    width:42px;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#22c55e18;
    font-size:18px;
}

.ticker-window{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
}

.ticker-track{
    display:inline-block;
    padding-left:100%;
    animation:tickerMove 14s linear infinite;
    font-size:12px;
    font-weight:600;
    color:#e2e8f0;
}

@keyframes tickerMove{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(-100%);
    }

}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    padding:12px 5px 18px;
}

.header-title{
    font-size:25px;
    font-weight:800;
    color:#22c55e;
}

.header-subtitle{
    margin-top:4px;
    color:#64748b;
    font-size:11px;
}

/* =========================
   PROFILE CARD
========================= */

.profile-card{
    width:100%;
    padding:26px 20px;
    border-radius:25px;
    background:
        linear-gradient(
            145deg,
            #111827,
            #172235
        );
    border:1px solid #ffffff10;
    box-shadow:
        0 15px 40px #0006,
        inset 0 1px 0 #ffffff08;
    text-align:center;
}

/* AVATAR */

.avatar{
    width:82px;
    height:82px;
    margin:0 auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        );
    border:3px solid #22c55e55;
    box-shadow:
        0 0 0 6px #22c55e10,
        0 12px 30px #22c55e25;
    font-size:34px;
    font-weight:800;
    color:#001b09;
}

/* USERNAME */

.username{
    margin-top:15px;
    font-size:24px;
    font-weight:800;
    word-break:break-word;
}

/* STATUS ROW */

.status-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:10px;
}

/* PREMIUM */

.badge{
    display:none;
    padding:5px 12px;
    background:#FFD700;
    color:#000;
    font-size:10px;
    font-weight:800;
    border-radius:30px;
    box-shadow:0 5px 15px #ffd70020;
}

/* ACCOUNT STATUS */

.account-status{
    padding:5px 12px;
    border-radius:30px;
    background:#22c55e18;
    border:1px solid #22c55e35;
    color:#4ade80;
    font-size:10px;
    font-weight:700;
}

.account-status.blocked{
    background:#ef444418;
    border-color:#ef444440;
    color:#f87171;
}

/* BGMI ID */

.player-name{
    margin-top:13px;
    font-size:13px;
    color:#94a3b8;
}

.player-name span{
    color:#e2e8f0;
    font-weight:600;
}

/* EMAIL */

.email{
    margin-top:7px;
    color:#64748b;
    font-size:11px;
    word-break:break-word;
}

/* =========================
   WALLET CARD
========================= */

.wallet-section{
    margin-top:16px;
}

.wallet-card{
    position:relative;
    overflow:hidden;
    padding:22px;
    border-radius:22px;
    background:
        linear-gradient(
            135deg,
            #0f172a,
            #111827
        );
    border:1px solid #22c55e25;
    box-shadow:0 12px 35px #0005;
}

.wallet-card::before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    right:-65px;
    top:-65px;
    border-radius:50%;
    background:#22c55e12;
}

.wallet-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.wallet-label{
    color:#94a3b8;
    font-size:11px;
    font-weight:600;
}

.wallet-icon{
    width:35px;
    height:35px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#22c55e18;
    font-size:17px;
}

.wallet-balance{
    margin-top:8px;
    font-size:31px;
    font-weight:800;
    color:#fff;
    letter-spacing:.3px;
}

/* =========================
   INFO CARD
========================= */

.info-card{
    margin-top:16px;
    padding:18px;
    background:#111827;
    border:1px solid #ffffff0d;
    border-radius:20px;
    box-shadow:0 10px 30px #0004;
}

.info-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:14px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #ffffff08;
}

.info-row:last-child{
    border-bottom:0;
    padding-bottom:0;
}

.info-label{
    color:#64748b;
    font-size:11px;
}

.info-value{
    color:#e2e8f0;
    font-size:12px;
    font-weight:600;
    text-align:right;
    word-break:break-word;
}

/* =========================
   SUPPORT BUTTON
========================= */

.support-btn{
    width:100%;
    height:52px;
    margin-top:16px;
    border:none;
    border-radius:15px;
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );
    color:#fff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 10px 25px #2563eb25;
    transition:.2s ease;
}

.support-btn:active{
    transform:scale(.98);
}

/* =========================
   LOGOUT
========================= */

.btn{
    width:100%;
    height:52px;
    margin-top:12px;
    border:none;
    border-radius:15px;
    background:
        linear-gradient(
            135deg,
            #dc2626,
            #991b1b
        );
    color:#fff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 10px 25px #dc262625;
}

.btn:active{
    transform:scale(.98);
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    background:#07111d;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.loader{
    width:55px;
    height:55px;
    border:5px solid #1f2937;
    border-top:5px solid #22c55e;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}

/* =========================
   ERROR
========================= */

.error-box{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:13px;
    background:#ef444418;
    border:1px solid #ef444435;
    color:#f87171;
    text-align:center;
    font-size:11px;
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

    .app{
        padding:11px;
    }

    .header-title{
        font-size:22px;
    }

    .profile-card{
        padding:22px 16px;
    }

    .username{
        font-size:21px;
    }

    .wallet-balance{
        font-size:28px;
    }

}

</style>

</head>

<body>

<div id="loading">
    <div class="loader"></div>
</div>

<div class="app">

<!-- =========================
     TOP BROADCAST
========================== -->

<div
    id="ticker"
    class="ticker">


<div class="ticker-icon">
    📢
</div>

<div class="ticker-window">

    <div
        id="tickerTrack"
        class="ticker-track">

        Loading announcement...

    </div>

</div>


</div>

<!-- =========================
     HEADER
========================== -->

<div class="header">


<div class="header-title">
    👤 My Profile
</div>

<div class="header-subtitle">
    Manage your account
</div>


</div>

<!-- =========================
     PROFILE
========================== -->

<div class="profile-card">


<div
    id="avatar"
    class="avatar">

    U

</div>


<div
    id="userName"
    class="username">

    Loading...

</div>


<div class="status-row">

    <div
        id="premiumBadge"
        class="badge">

        👑 PREMIUM

    </div>


    <div
        id="accountStatus"
        class="account-status">

        🟢 ACTIVE

    </div>

</div>


<div
    id="playerName"
    class="player-name">

    BGMI ID:
    <span>Loading...</span>

</div>


<div
    id="email"
    class="email">

    Loading...

</div>


</div>

<!-- =========================
     WALLET
========================== -->

<div class="wallet-section">


<div class="wallet-card">

    <div class="wallet-top">

        <div class="wallet-label">
            WALLET BALANCE
        </div>

        <div class="wallet-icon">
            💰
        </div>

    </div>


    <div
        id="wallet"
        class="wallet-balance">

        ₹0

    </div>

</div>


</div>

<!-- =========================
     ACCOUNT INFO
========================== -->

<div class="info-card">


<div class="info-title">
    Account Information
</div>


<div class="info-row">

    <div class="info-label">
        Account Status
    </div>

    <div
        id="statusValue"
        class="info-value">

        Active

    </div>

</div>


<div class="info-row">

    <div class="info-label">
        BGMI ID
    </div>

    <div
        id="bgmiValue"
        class="info-value">

        Not Added

    </div>

</div>


<div class="info-row">

    <div class="info-label">
        Email
    </div>

    <div
        id="emailValue"
        class="info-value">

        --

    </div>

</div>


</div>

<!-- =========================
     ERROR
========================== -->

<div
    id="errorBox"
    class="error-box">

</div>

<!-- =========================
     SUPPORT
========================== -->

<button
 class="support-btn"
 onclick="openSupport()">


🛟 Support


</button>

<!-- =========================
     LOGOUT
========================== -->

<button
 class="btn"
 onclick="logout()">


🚪 Logout

</button>

</div>

<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

    authDomain:
        "incoinpaysliveearning.firebaseapp.com",

    databaseURL:
        "https://incoinpaysliveearning-default-rtdb.firebaseio.com",

    projectId:
        "incoinpaysliveearning",

    storageBucket:
        "incoinpaysliveearning.firebasestorage.app",

    messagingSenderId:
        "971873814750",

    appId:
        "1:971873814750:web:7418c7da119e4725ed9a4f"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById("loading");

const userName =
    document.getElementById("userName");

const playerName =
    document.getElementById("playerName");

const wallet =
    document.getElementById("wallet");

const premiumBadge =
    document.getElementById("premiumBadge");

const avatar =
    document.getElementById("avatar");

const email =
    document.getElementById("email");

const bgmiValue =
    document.getElementById("bgmiValue");

const emailValue =
    document.getElementById("emailValue");

const accountStatus =
    document.getElementById("accountStatus");

const statusValue =
    document.getElementById("statusValue");

const errorBox =
    document.getElementById("errorBox");

const ticker =
    document.getElementById("ticker");

const tickerTrack =
    document.getElementById("tickerTrack");


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    (user) => {

        if(!user){

            location.replace("index.html");

            return;

        }


        const userRef =
            ref(
                db,
                "users/" + user.uid
            );


        /* =========================================
           REAL-TIME USER DATA
        ========================================= */

        onValue(

            userRef,

            (snap) => {

                if(loading){

                    loading.style.display =
                        "none";

                }


                if(!snap.exists()){

                    showUserName(
                        user.displayName ||
                        user.email?.split("@")[0] ||
                        "Player"
                    );

                    if(email){

                        email.textContent =
                            user.email || "";

                    }

                    if(emailValue){

                        emailValue.textContent =
                            user.email || "--";

                    }

                    return;

                }


                const data =
                    snap.val() || {};


                /* =========================
                   NAME
                ========================= */

                const name =
                    getUserName(
                        data,
                        user
                    );


                showUserName(name);


                /* =========================
                   EMAIL
                ========================= */

                const userEmail =
                    data.email ||
                    user.email ||
                    "--";


                if(email){

                    email.textContent =
                        userEmail;

                }


                if(emailValue){

                    emailValue.textContent =
                        userEmail;

                }


                /* =========================
                   BGMI ID
                ========================= */

                const bgmiId =
                    data.bgmiId ||
                    data.bgmiID ||
                    data.bgmi_id ||
                    data.playerId ||
                    "";


                if(playerName){

                    playerName.innerHTML =
                        "BGMI ID: <span>" +
                        escapeHTML(
                            bgmiId || "Not Added"
                        ) +
                        "</span>";

                }


                if(bgmiValue){

                    bgmiValue.textContent =
                        bgmiId || "Not Added";

                }


                /* =========================
                   WALLET
                ========================= */

                let balance = 0;


                if(
                    data.wallet &&
                    typeof data.wallet === "object"
                ){

                    balance =
                        Number(
                            data.wallet.balance ?? 0
                        );

                }
                else{

                    balance =
                        Number(
                            data.wallet ?? 0
                        );

                }


                if(
                    !Number.isFinite(balance)
                ){

                    balance = 0;

                }


                if(wallet){

                    wallet.textContent =
                        "₹" +
                        balance.toLocaleString(
                            "en-IN",
                            {
                                maximumFractionDigits:0
                            }
                        );

                }


                /* =========================
                   PREMIUM
                ========================= */

                const isPremium =
                    data.premium === true ||
                    data.premium === "true" ||
                    data.plan === "premium" ||
                    data.membership === "premium";


                if(premiumBadge){

                    premiumBadge.style.display =
                        isPremium
                            ? "inline-block"
                            : "none";

                }


                /* =========================
                   ACCOUNT STATUS
                ========================= */

                const rawStatus =
                    String(
                        data.status ||
                        "active"
                    ).toLowerCase();


                const isBlocked =
                    rawStatus === "blocked" ||
                    rawStatus === "banned" ||
                    rawStatus === "disabled";


                if(accountStatus){

                    if(isBlocked){

                        accountStatus.textContent =
                            "🔴 BLOCKED";

                        accountStatus.classList.add(
                            "blocked"
                        );

                    }
                    else{

                        accountStatus.textContent =
                            "🟢 ACTIVE";

                        accountStatus.classList.remove(
                            "blocked"
                        );

                    }

                }


                if(statusValue){

                    statusValue.textContent =
                        isBlocked
                            ? "Blocked"
                            : "Active";

                }

            },

            (error) => {

                console.error(
                    "DATABASE ERROR:",
                    error
                );


                if(loading){

                    loading.style.display =
                        "none";

                }


                showError(
                    "Unable to load profile. Please check Firebase Database Rules."
                );

            }

        );


        /* =========================================
           LOAD TOP BROADCAST
        ========================================= */

        loadBroadcasts();

    }
);


/* =====================================================
   GET USER NAME
===================================================== */

function getUserName(
    data,
    user
){

    const databaseName =
        data.name ||
        data.displayName ||
        data.username ||
        data.fullName ||
        data.playerName ||
        data.userName ||
        data.player_name;


    const authName =
        user.displayName;


    const emailName =
        user.email
            ? user.email.split("@")[0]
            : "";


    return String(
        databaseName ||
        authName ||
        emailName ||
        "Player"
    ).trim() || "Player";

}


/* =====================================================
   SHOW USER
===================================================== */

function showUserName(name){

    name =
        String(
            name || "Player"
        ).trim();


    if(!name){

        name = "Player";

    }


    if(userName){

        userName.textContent =
            name;

    }


    /* AVATAR INITIAL */

    if(avatar){

        const firstLetter =
            name
                .charAt(0)
                .toUpperCase();


        avatar.textContent =
            firstLetter || "U";

    }

}


/* =====================================================
   LOAD ADMIN BROADCAST
===================================================== */

function loadBroadcasts(){

    const broadcastsRef =
        ref(
            db,
            "broadcasts"
        );


    onValue(

        broadcastsRef,

        (snapshot) => {

            if(
                !snapshot.exists()
            ){

                hideTicker();

                return;

            }


            const broadcasts = [];


            snapshot.forEach(
                (child) => {

                    const data =
                        child.val() || {};


                    const active =
                        data.active === true ||
                        data.active === "true";


                    if(active){

                        broadcasts.push({

                            id:
                                child.key,

                            ...data

                        });

                    }

                }
            );


            if(
                broadcasts.length === 0
            ){

                hideTicker();

                return;

            }


            /* NEWEST FIRST */

            broadcasts.sort(
                (a,b) => {

                    return Number(
                        b.createdAt || 0
                    )
                    -
                    Number(
                        a.createdAt || 0
                    );

                }
            );


            const latest =
                broadcasts[0];


            const title =
                latest.title ||
                "Announcement";


            const message =
                latest.message ||
                "";


            tickerTrack.textContent =
                "📢 " +
                title +
                " • " +
                message;


            ticker.style.display =
                "flex";

        },

        (error) => {

            console.error(
                "BROADCAST ERROR:",
                error
            );

            hideTicker();

        }

    );

}


/* =====================================================
   HIDE TICKER
===================================================== */

function hideTicker(){

    if(ticker){

        ticker.style.display =
            "none";

    }

}


/* =====================================================
   SUPPORT
===================================================== */

window.openSupport =
    function(){

        location.href =
            "support.html";

    };


/* =====================================================
   ERROR
===================================================== */

function showError(message){

    if(!errorBox){

        return;

    }


    errorBox.textContent =
        message;


    errorBox.style.display =
        "block";

}


/* =====================================================
   LOGOUT
===================================================== */

window.logout =
    function(){

        const confirmed =
            confirm(
                "Are you sure you want to logout?"
            );


        if(!confirmed){

            return;

        }


        signOut(auth)

            .then(
                () => {

                    location.replace(
                        "index.html"
                    );

                }
            )

            .catch(
                (error) => {

                    console.error(
                        "Logout Error:",
                        error
                    );


                    alert(
                        "Logout failed. Please try again."
                    );

                }
            );

    };


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}

</script>

</body>
</html>
