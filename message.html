<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#050B18">
<meta name="color-scheme" content="dark">

<title>Messages • BGMI ESPORTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    min-height:100%;
    scroll-behavior:smooth;
}

body{
    width:100%;
    min-height:100vh;
    background:#050B18;
    color:#fff;
    overflow-x:hidden;
    padding-bottom:90px;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:0;
}

button:active{
    transform:scale(.96);
}

::-webkit-scrollbar{
    width:0;
    height:0;
}

/* =========================================================
   BACKGROUND
========================================================= */

.bgImage{
    position:fixed;
    inset:0;

    background-image:url(
        "https://images.pexels.com/photos/7915357/pexels-photo-7915357.jpeg"
    );

    background-size:cover;
    background-position:center;

    opacity:.055;

    z-index:-3;
}

.bgOverlay{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(5,11,24,.94),
            rgba(5,11,24,.99)
        );

    z-index:-2;
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 8% 0%,
            rgba(34,197,94,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 95% 15%,
            rgba(37,99,235,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(245,158,11,.045),
            transparent 35%
        );

    pointer-events:none;
    z-index:-1;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;

    margin:auto;

    padding:
        0
        14px
        105px;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        calc(12px + env(safe-area-inset-top))
        1px
        12px;

    background:rgba(5,11,24,.94);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(255,255,255,.055);
}

.headerTitleBox{
    min-width:0;
    text-align:center;
}

.headerTitle{
    font-size:18px;
    font-weight:800;
    line-height:1.2;
}

.headerSubtitle{
    margin-top:3px;

    color:#64748b;

    font-size:7px;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:1px;
}

/* =========================================================
   SEARCH
========================================================= */

.searchBox{
    position:relative;
    margin:14px 0 11px;
}

.searchBox input{
    width:100%;
    height:46px;

    padding:
        0
        44px
        0
        43px;

    outline:none;

    border-radius:15px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #0e1a2d,
            #0a1423
        );

    border:1px solid rgba(255,255,255,.065);

    font-size:10px;
    font-weight:600;
}

.searchBox input:focus{
    border-color:rgba(34,197,94,.35);

    box-shadow:
        0 0 0 3px rgba(34,197,94,.06),
        0 10px 28px rgba(0,0,0,.15);
}

.searchBox input::placeholder{
    color:#526177;
}

.searchIcon{
    position:absolute;
    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#64748b;
    font-size:15px;

    pointer-events:none;
}

.clearSearch{
    position:absolute;

    right:8px;
    top:50%;

    transform:translateY(-50%);

    width:31px;
    height:31px;

    display:none;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#172337;
    color:#94a3b8;

    font-size:16px;
}

/* =========================================================
   FILTER
========================================================= */

.filterRow{
    display:flex;
    gap:7px;

    margin-bottom:13px;

    overflow-x:auto;
    scrollbar-width:none;
}

.filterRow::-webkit-scrollbar{
    display:none;
}

.filterBtn{
    flex-shrink:0;

    height:31px;

    padding:0 12px;

    border-radius:10px;

    background:#0d192b;
    color:#718096;

    border:1px solid rgba(255,255,255,.055);

    font-size:7px;
    font-weight:800;

    text-transform:uppercase;
}

.filterBtn.active{
    background:
        linear-gradient(
            135deg,
            rgba(34,197,94,.18),
            rgba(34,197,94,.07)
        );

    color:#22c55e;

    border-color:rgba(34,197,94,.24);
}

/* =========================================================
   ADMIN BADGE
========================================================= */

.adminOnlyBadge{
    display:flex;
    align-items:center;
    gap:10px;

    margin-bottom:13px;
    padding:11px 13px;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            rgba(34,197,94,.11),
            rgba(14,25,43,.96)
        );

    border:1px solid rgba(34,197,94,.14);
}

.adminOnlyIcon{
    width:35px;
    height:35px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:rgba(34,197,94,.11);

    font-size:16px;
}

.adminOnlyTitle{
    color:#22c55e;

    font-size:9px;
    font-weight:900;

    text-transform:uppercase;
}

.adminOnlyText{
    margin-top:2px;

    color:#64748b;

    font-size:7px;
    font-weight:600;

    line-height:1.45;
}

/* =========================================================
   ANNOUNCEMENT
========================================================= */

.announcement{
    display:flex;
    align-items:center;

    min-height:53px;

    margin-bottom:13px;
    padding:8px 11px;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            rgba(34,197,94,.105),
            rgba(14,25,43,.97)
        );

    border:1px solid rgba(34,197,94,.13);
}

.announcementIcon{
    width:36px;
    height:36px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:rgba(34,197,94,.11);

    font-size:16px;
}

.announcementContent{
    min-width:0;
    margin-left:9px;
}

.announcementLabel{
    color:#22c55e;

    font-size:7px;
    font-weight:900;

    text-transform:uppercase;
    letter-spacing:.6px;
}

.announcementText{
    margin-top:2px;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    color:#b8c4d5;

    font-size:8px;
    font-weight:600;
}

/* =========================================================
   BROADCAST
========================================================= */

.broadcastCard{
    display:none;

    position:relative;

    margin-bottom:13px;
    padding:14px;

    overflow:hidden;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(245,158,11,.14),
            rgba(14,25,43,.98)
        );

    border:1px solid rgba(245,158,11,.17);
}

.broadcastCard.show{
    display:block;
    animation:broadcastIn .25s ease;
}

@keyframes broadcastIn{

    from{
        opacity:0;
        transform:translateY(-6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.broadcastGlow{
    position:absolute;

    width:110px;
    height:110px;

    right:-45px;
    top:-45px;

    border-radius:50%;

    background:rgba(245,158,11,.08);
}

.broadcastTop{
    position:relative;

    display:flex;
    align-items:center;
    gap:9px;
}

.broadcastIcon{
    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:rgba(245,158,11,.12);

    font-size:16px;
}

.broadcastTitle{
    color:#fbbf24;

    font-size:10px;
    font-weight:900;
}

.broadcastDate{
    margin-top:2px;

    color:#64748b;

    font-size:7px;
}

.broadcastText{
    position:relative;

    margin-top:11px;

    color:#d1d9e5;

    font-size:9px;
    line-height:1.7;

    white-space:pre-wrap;
    word-break:break-word;
}

/* =========================================================
   SECTION
========================================================= */

.sectionHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:16px 2px 9px;
}

.sectionTitle{
    display:flex;
    align-items:center;
    gap:7px;
}

.sectionTitle h3{
    font-size:13px;
    font-weight:800;
}

.sectionLiveDot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:
        0 0 9px rgba(34,197,94,.7);
}

.sectionCount{
    color:#55647a;

    font-size:7px;
    font-weight:800;

    text-transform:uppercase;
}

/* =========================================================
   MESSAGE LIST
========================================================= */

.messageList{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.messageItem{
    position:relative;

    display:flex;
    align-items:center;

    min-height:84px;

    padding:11px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #0d192b,
            #0a1423
        );

    border:1px solid rgba(255,255,255,.055);

    overflow:hidden;

    transition:.18s;
}

.messageItem::before{
    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:3px;

    background:transparent;
}

.messageItem.unread{
    background:
        linear-gradient(
            135deg,
            rgba(34,197,94,.105),
            rgba(10,20,35,.98)
        );

    border-color:rgba(34,197,94,.18);
}

.messageItem.unread::before{
    background:#22c55e;

    box-shadow:
        0 0 12px rgba(34,197,94,.45);
}

.messageItem.read{
    opacity:.84;
}

.messageItem:active{
    transform:scale(.985);
}

/* =========================================================
   AVATAR
========================================================= */

.avatarWrap{
    position:relative;
    flex-shrink:0;
}

.avatar{
    width:52px;
    height:52px;

    display:block;

    object-fit:cover;

    border-radius:16px;

    background:#172338;

    border:1px solid rgba(34,197,94,.16);
}

.adminCrown{
    position:absolute;

    right:-4px;
    top:-5px;

    width:19px;
    height:19px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#f59e0b;

    border:2px solid #0b1627;

    font-size:9px;
}

/* =========================================================
   MESSAGE CONTENT
========================================================= */

.messageMain{
    min-width:0;
    flex:1;
    margin-left:11px;
}

.messageTop{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:7px;
}

.messageName{
    min-width:0;

    overflow:hidden;

    white-space:nowrap;
    text-overflow:ellipsis;

    font-size:10px;
    font-weight:800;
}

.adminLabel{
    display:inline-flex;
    align-items:center;

    margin-left:5px;
    padding:2px 5px;

    border-radius:5px;

    background:rgba(245,158,11,.12);

    color:#fbbf24;

    font-size:5px;
    font-weight:900;
}

.messageTime{
    flex-shrink:0;

    color:#526177;

    font-size:7px;
    font-weight:600;
}

.messagePreview{
    margin-top:5px;

    overflow:hidden;

    white-space:nowrap;
    text-overflow:ellipsis;

    color:#9aa8ba;

    font-size:8px;
    font-weight:500;

    line-height:1.5;
}

.messageBottom{
    display:flex;
    align-items:center;

    gap:6px;

    margin-top:5px;
}

.messageType{
    display:inline-flex;
    align-items:center;

    padding:2px 6px;

    border-radius:6px;

    background:rgba(34,197,94,.08);

    color:#22c55e;

    font-size:5px;
    font-weight:900;

    text-transform:uppercase;
}

.readLabel{
    color:#536279;

    font-size:5px;
    font-weight:700;

    text-transform:uppercase;
}

.unreadDot{
    flex-shrink:0;

    width:8px;
    height:8px;

    margin-left:7px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:
        0 0 10px rgba(34,197,94,.55);

    animation:unreadPulse 1.7s infinite;
}

@keyframes unreadPulse{

    0%,100%{
        box-shadow:
            0 0 5px rgba(34,197,94,.35);
    }

    50%{
        box-shadow:
            0 0 13px rgba(34,197,94,.8);
    }

}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    padding:48px 20px;

    text-align:center;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            #0d192b,
            #0a1423
        );

    border:1px solid rgba(255,255,255,.05);
}

.emptyIcon{
    width:64px;
    height:64px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:21px;

    background:#101e32;

    font-size:27px;
}

.emptyTitle{
    margin-top:13px;

    font-size:12px;
    font-weight:800;

    color:#aab6c8;
}

.emptyText{
    max-width:280px;

    margin:6px auto 0;

    color:#536279;

    font-size:8px;
    line-height:1.7;
}

/* =========================================================
   LOADER
========================================================= */

.loader{
    display:flex;
    justify-content:center;
    align-items:center;

    gap:6px;

    padding:42px;
}

.dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#22c55e;

    animation:loaderBounce .8s infinite alternate;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes loaderBounce{

    from{
        transform:translateY(0);
        opacity:.4;
    }

    to{
        transform:translateY(-7px);
        opacity:1;
    }

}

/* =========================================================
   CENTER MODAL
========================================================= */

.messageModal{
    position:fixed;
    inset:0;

    z-index:99999;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.messageModal.show{
    display:flex;
}

.messageModalBox{
    position:relative;

    width:100%;
    max-width:440px;

    max-height:min(620px,82vh);

    overflow-y:auto;

    padding:18px;

    border-radius:24px;

    background:
        linear-gradient(
            160deg,
            #111d31,
            #07101f 78%
        );

    border:1px solid rgba(34,197,94,.20);

    box-shadow:
        0 25px 80px rgba(0,0,0,.60),
        0 0 45px rgba(34,197,94,.06);

    animation:modalCenter .22s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalCenter{

    from{
        opacity:0;
        transform:scale(.88);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.modalHandle{
    width:40px;
    height:4px;

    margin:0 auto 16px;

    border-radius:20px;

    background:#334155;
}

.messageModalHeader{
    display:flex;
    align-items:center;

    gap:10px;

    margin-bottom:14px;
}

.modalAvatar{
    width:48px;
    height:48px;

    flex-shrink:0;

    object-fit:cover;

    border-radius:15px;

    background:#172338;

    border:1px solid rgba(245,158,11,.20);
}

.modalUser{
    min-width:0;
    flex:1;
}

.modalUserName{
    overflow:hidden;

    white-space:nowrap;
    text-overflow:ellipsis;

    font-size:12px;
    font-weight:800;
}

.modalUserRole{
    margin-top:3px;

    color:#fbbf24;

    font-size:7px;
    font-weight:800;

    text-transform:uppercase;
}

.modalClose{
    width:36px;
    height:36px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:#18263a;
    color:#94a3b8;

    font-size:19px;
}

.modalClose:active{
    background:#24344d;
}

.fullMessage{
    padding:15px;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #0a1526,
            #091321
        );

    border:1px solid rgba(255,255,255,.06);

    color:#d5deea;

    font-size:10px;
    line-height:1.8;

    white-space:pre-wrap;
    word-break:break-word;
}

.fullMessageTime{
    margin-top:9px;

    text-align:right;

    color:#526177;

    font-size:7px;
    font-weight:600;
}

.modalMessageMeta{
    display:flex;
    align-items:center;

    gap:6px;

    margin-top:10px;
}

.modalBadge{
    padding:4px 7px;

    border-radius:7px;

    background:rgba(34,197,94,.08);

    color:#22c55e;

    font-size:6px;
    font-weight:900;

    text-transform:uppercase;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottomNav{
    position:fixed;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:100%;
    max-width:520px;

    height:73px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    padding:
        5px 8px
        calc(5px + env(safe-area-inset-bottom));

    background:rgba(8,17,31,.98);

    border-top:1px solid rgba(255,255,255,.07);

    box-shadow:
        0 -10px 30px rgba(0,0,0,.28);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    z-index:9000;
}

.navBtn{
    position:relative;

    flex:1;

    height:62px;

    background:none;

    color:#65748a;

    font-size:8px;
    font-weight:700;
}

.navIcon{
    width:35px;
    height:32px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    font-size:18px;
}

.navBtn.active{
    color:#22c55e;
}

.navBtn.active .navIcon{
    background:rgba(34,197,94,.12);
}

.navBadge{
    position:absolute;

    top:1px;
    right:calc(50% - 19px);

    min-width:14px;
    height:14px;

    padding:0 3px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:#ef4444;
    color:#fff;

    border:2px solid #08111f;

    font-size:6px;
    font-weight:900;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:88px;

    transform:translate(-50%,20px);

    width:calc(100% - 30px);
    max-width:450px;

    padding:11px 14px;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #172337,
            #101c2e
        );

    border:1px solid rgba(255,255,255,.08);

    color:#dbe4ef;

    text-align:center;

    font-size:8px;
    font-weight:700;

    opacity:0;
    pointer-events:none;

    transition:.25s;

    z-index:100000;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:360px){

    .app{
        padding-left:11px;
        padding-right:11px;
    }

    .messageItem{
        min-height:78px;
    }

    .avatar{
        width:48px;
        height:48px;
    }

    .messageModal{
        padding:15px;
    }

    .messageModalBox{
        padding:15px;
        border-radius:21px;
    }

}

@media(max-width:320px){

    .headerTitle{
        font-size:16px;
    }

    .messageItem{
        padding:9px;
    }

    .messageMain{
        margin-left:8px;
    }

    .avatar{
        width:45px;
        height:45px;
        border-radius:14px;
    }

    .messageName{
        font-size:9px;
    }

    .messagePreview{
        font-size:7px;
    }

}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }

}

</style>
</head>

<body>

<div class="bgImage"></div>
<div class="bgOverlay"></div>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="headerTitleBox">

        <div class="headerTitle">
            Messages
        </div>

        <div class="headerSubtitle">
            ADMIN UPDATES & NOTIFICATIONS
        </div>

    </div>

</header>


<!-- =====================================================
     SEARCH
===================================================== -->

<div class="searchBox">

/* =========================================================
   LOAD ADMIN MESSAGES
========================================================= */

function loadAdminMessages(){

    if(
        !db ||
        !currentUID ||
        messagesListenerStarted
    ){

        return;

    }

    messagesListenerStarted = true;

    const messagesRef =
        ref(db,"messages");


    onValue(

        messagesRef,

        snapshot => {

            const list = [];

            const root =
                snapshot.exists()
                    ? snapshot.val()
                    : null;


            if(root){

                scanMessageTree(
                    root,
                    [],
                    list
                );

            }


            const unique =
                new Map();

            list.forEach(
                message => {

                    if(!unique.has(message.id)){

                        unique.set(
                            message.id,
                            message
                        );

                    }

                }
            );


            messages =
                Array.from(
                    unique.values()
                );


            messages.sort(
                (a,b) => {

                    return (
                        getTimestamp(b) -
                        getTimestamp(a)
                    );

                }
            );


            const newIds =
                new Set(
                    messages.map(
                        message => message.id
                    )
                );


            if(!firstMessageLoad){

                const hasNew =
                    messages.some(
                        message =>
                            !previousMessageIds.has(
                                message.id
                            )
                    );


                if(hasNew){

                    showNewMessageToast();

                }

            }


            previousMessageIds =
                newIds;

            firstMessageLoad =
                false;


            renderMessages();

            updateUnread();

        },

        error => {

            console.error(
                "Firebase messages error:",
                error
            );

            renderEmpty(
                "Unable to Load Messages",
                "Firebase permission denied. Check your Realtime Database rules."
            );

            showToast(
                "Firebase permission denied"
            );

        }

    );

}


/* =========================================================
   SCAN FIREBASE TREE
========================================================= */

function scanMessageTree(
    node,
    path,
    list
){

    if(
        !node ||
        typeof node !== "object" ||
        Array.isArray(node)
    ){

        return;

    }


    Object.entries(node).forEach(
        ([key,value]) => {

            if(
                !value ||
                typeof value !== "object"
            ){

                return;

            }


            if(isMessageObject(value)){

                processFirebaseMessage(
                    key,
                    value,
                    path,
                    list
                );

                return;

            }


            scanMessageTree(
                value,
                [...path,key],
                list
            );

        }
    );

}


/* =========================================================
   MESSAGE DETECTION
========================================================= */

function isMessageObject(data){

    if(
        !data ||
        typeof data !== "object"
    ){

        return false;

    }


    const text =
        data.text ??
        data.message ??
        data.body ??
        data.content ??
        data.description ??
        "";


    return String(text).trim() !== "";

}


/* =========================================================
   PROCESS MESSAGE
========================================================= */

function processFirebaseMessage(
    messageId,
    data,
    path,
    list
){

    if(
        !data ||
        typeof data !== "object"
    ){

        return;

    }


    const senderId =
        String(
            data.senderId ??
            data.senderUid ??
            data.senderUID ??
            data.adminUid ??
            data.adminUID ??
            data.fromUid ??
            data.fromUID ??
            data.from ??
            data.createdBy ??
            data.createdByUid ??
            ""
        );


    const adminField =
        String(
            data.adminId ??
            data.adminUID ??
            data.adminUid ??
            data.admin ??
            data.createdBy ??
            data.createdByUid ??
            ""
        );


    const isAdmin =
        senderId === ADMIN_UID ||
        adminField === ADMIN_UID;


    if(
        senderId &&
        !isAdmin
    ){

        return;

    }


    const insideUserNode =
        path.includes(currentUID);


    if(
        !isAdmin &&
        !insideUserNode
    ){

        return;

    }


    const receiverId =
        String(
            data.receiverId ??
            data.receiverUid ??
            data.receiverUID ??
            data.toUid ??
            data.toUID ??
            data.userId ??
            data.uid ??
            data.to ??
            ""
        );


    if(
        receiverId &&
        receiverId !== currentUID &&
        receiverId.toLowerCase() !== "all" &&
        receiverId.toLowerCase() !== "broadcast"
    ){

        return;

    }


    const text =
        String(
            data.text ??
            data.message ??
            data.body ??
            data.content ??
            data.description ??
            ""
        ).trim();


    if(!text){

        return;

    }


    const customId =
        String(
            data.id ??
            data.messageId ??
            messageId
        );


    const finalId =
        customId ||
        path.join("_") ||
        messageId;


    list.push({

        ...data,

        id:finalId,

        senderId:
            isAdmin
                ? ADMIN_UID
                : senderId,

        text:text,

        _firebasePath:[
            ...path,
            messageId
        ]

    });

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(message){

    const value =
        message?.timestamp ??
        message?.createdAt ??
        message?.time ??
        message?.date ??
        0;


    if(
        typeof value === "object" &&
        value !== null
    ){

        if(
            typeof value.seconds === "number"
        ){

            return value.seconds * 1000;

        }

    }


    const number =
        Number(value);


    if(
        !Number.isNaN(number) &&
        number > 0
    ){

        if(number < 10000000000){

            return number * 1000;

        }

        return number;

    }


    const parsed =
        Date.parse(String(value));


    return Number.isNaN(parsed)
        ? 0
        : parsed;

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    if(!messageList){

        return;

    }


    const search =
        String(
            searchInput?.value || ""
        )
        .trim()
        .toLowerCase();


    let list =
        messages.filter(
            message =>
                String(
                    message.senderId || ""
                ) === ADMIN_UID
        );


    if(currentFilter !== "all"){

        list =
            list.filter(
                message =>
                    getMessageType(message) ===
                    currentFilter
            );

    }


    if(search){

        list =
            list.filter(
                message => {

                    const text =
                        String(
                            message.text || ""
                        ).toLowerCase();

                    const type =
                        getMessageType(
                            message
                        ).toLowerCase();

                    const typeLabel =
                        getMessageTypeLabel(
                            type
                        ).toLowerCase();


                    return (
                        text.includes(search) ||
                        type.includes(search) ||
                        typeLabel.includes(search)
                    );

                }
            );

    }


    const count =
        document.getElementById(
            "messageCount"
        );


    if(count){

        count.textContent =
            list.length +
            (
                list.length === 1
                    ? " MESSAGE"
                    : " MESSAGES"
            );

    }


    if(list.length === 0){

        renderEmpty(

            search ||
            currentFilter !== "all"
                ? "No Results"
                : "No Admin Messages",

            search ||
            currentFilter !== "all"
                ? "Try another search or message category."
                : "Official admin announcements and messages will appear here."

        );

        return;

    }


    messageList.innerHTML = "";


    list.forEach(
        message => {

            messageList.appendChild(
                createMessageItem(
                    message
                )
            );

        }
    );

}


/* =========================================================

/* =========================================================

========================================================= */

async function openAdminMessage(message){

    if(
        String(
            message.senderId || ""
        ) !== ADMIN_UID
    ){

        return;

    }


    if(!isRead(message)){

    }

/* =========================================================
   MARK SINGLE READ
========================================================= */

async function markMessageRead(message){

    if(
        !db ||
        !currentUID ||
        !message
    ){

        return;

    }


    const updates = {};

    const now =
        Date.now();


    if(
        Array.isArray(
            message._firebasePath
        ) &&
        message._firebasePath.length > 0
    ){

        const path =
            message._firebasePath.join("/");


        updates[
            "messages/" +
            path +
            "/read"
        ] = true;


        updates[
            "messages/" +
            path +
            "/readAt"
        ] = now;

    }
    else{

        updates[
            "messages/" +
            currentUID +
            "/" +
            message.id +
            "/read"
        ] = true;


        updates[
            "messages/" +
            currentUID +
            "/" +
            message.id +
            "/readAt"
        ] = now;

    }


    try{

        await update(
            ref(db),
            updates
        );


        message.read = true;
        message.readAt = now;

    }
    catch(error){

        console.error(
            "Mark read failed:",
            error
        );

    }

}

/* =========================================================
   MESSAGE TYPE
========================================================= */

function getMessageType(message){

    const raw =
        String(
            message.type ||
            message.category ||
            message.messageType ||
            ""
        )
        .trim()
        .toLowerCase();


    if(
        raw.includes("match") ||
        raw.includes("game")
    ){

        return "match";

    }


    if(
        raw.includes("payment") ||
        raw.includes("deposit") ||
        raw.includes("wallet") ||
        raw.includes("withdraw")
    ){

        return "payment";

    }


    if(
        raw.includes("result") ||
        raw.includes("winner") ||
        raw.includes("winning")
    ){

        return "result";

    }


    if(
        raw.includes("important") ||
        raw.includes("urgent") ||
        raw.includes("alert")
    ){

        return "important";

    }


    return "announcement";

}


/* =========================================================
   TYPE LABEL
========================================================= */

function getMessageTypeLabel(type){

    const labels = {

        announcement:
            "Announcement",

        match:
            "Match Update",

        payment:
            "Payment",

        result:
            "Result",

        important:
            "Important"

    };


    return (
        labels[type] ||
        "Official Message"
    );

}

    button
){

    currentFilter =
        filter;

        )

            btn => {

                btn.classList.remove(

                );

            }
        );


    if(button){

        button.classList.add(

        );

    }


    renderMessages();

};


/* =========================================================
   ANNOUNCEMENT
========================================================= */

function loadAnnouncement(){

    if(
        !db ||
        announcementListenerStarted
    ){

        return;

    }


    announcementListenerStarted = true;


    onValue(

        ref(
            db,
            "announcement"
        ),

        snapshot => {

            const box =
                document.getElementById(
                    "announcementText"
                );


            if(!snapshot.exists()){

                if(box){

                    box.textContent =
                        "Welcome to BGMI ESPORTS";

                }

                return;

            }


            const value =
                snapshot.val();


            let text = "";


            if(
                typeof value === "string"
            ){

                text = value;

            }
            else if(value){

                text =
                    value.text ||
                    value.message ||
                    value.title ||
                    "";

            }


            if(
                box &&
                text
            ){

                box.textContent =
                    text;

            }

        },

        error => {

            console.error(
                "Announcement error:",
                error
            );

        }

    );

}


/* =========================================================
   BROADCAST

function loadBroadcast(){

    if(
        !db ||
        broadcastListenerStarted
    ){

        return;

    }


    broadcastListenerStarted = true;


    onValue(

        ref(
            db,
            "adminBroadcast"
        ),

        snapshot => {

            const card =
                document.getElementById(
                    "broadcastCard"
                );


            if(!snapshot.exists()){

                card?.classList.remove(
                    "show"
                );

                return;

            }


            const data =
                snapshot.val() || {};


            const text =
                data.text ||
                data.message ||
                data.body ||
                "";


            if(!text){

                card?.classList.remove(
                    "show"
                );

                return;

            }


            const textBox =
                document.getElementById(
                    "broadcastText"
                );


            const dateBox =
                document.getElementById(
                    "broadcastDate"
                );


            if(textBox){

                textBox.textContent =
                    text;

            }


            if(dateBox){

                dateBox.textContent =
                    formatMessageTime(
                        getTimestamp(data)
                    );

            }


            card?.classList.add(
                "show"
            );

        },

        error => {

            console.error(
                "Broadcast error:",
                error
            );

        }

    );

}


/* =========================================================
   UNREAD
========================================================= */

function updateUnread(){

    const unread =
        messages.filter(
            message => {

                return (
                    String(
                        message.senderId || ""
                    ) === ADMIN_UID &&
                    !isRead(message)
                );

            }
        ).length;


    const bottom =
        document.getElementById(
            "bottomBadge"
        );


    if(unread > 0){

        const display =
            unread > 99
                ? "99+"
                : unread;


        if(bottom){

            bottom.textContent =
                display;

            bottom.style.display =
                "flex";

        }

    }
    else{

        if(bottom){

            bottom.style.display =
                "none";

        }

    }

}

/* =========================================================
   READ CHECK
========================================================= */

function isRead(message){

    return (
        message.read === true ||
        message.isRead === true
    );

}


/* =========================================================
   TIME
========================================================= */

function formatMessageTime(timestamp){

    if(!timestamp){

        return "Now";

    }


    const date =
        new Date(
            Number(timestamp)
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Now";

    }


    const now =
        new Date();


    const diff =
        now.getTime() -
        date.getTime();


    if(diff < 0){

        return "Just now";

    }


    if(diff < 60000){

        return "Just now";

    }


    if(diff < 3600000){

        return (
            Math.floor(
                diff / 60000
            ) +
            "m ago"
        );

    }


    if(
        date.toDateString() ===
        now.toDateString()
    ){

        return date.toLocaleTimeString(
            "en-IN",
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"numeric",
            month:"short"
        }
    );

}


/* =========================================================
   FULL DATE
========================================================= */

function formatFullDate(timestamp){

    if(!timestamp){

        return "Just now";

    }


    const date =
        new Date(
            Number(timestamp)
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Just now";

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"numeric",
            month:"short",
            year:"numeric",
            hour:"numeric",
            minute:"2-digit"
        }
    );

}

/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){

        return;

    }


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2400
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(value){

    return escapeHTML(
        value
    );

}
