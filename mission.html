
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#050B18">

<title>Mission</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#13213d 0%,#050B18 45%,#02050b 100%);
    color:#fff;
    padding:20px;
    padding-bottom:40px;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
}

/* HEADER */

.header{
    margin-bottom:20px;
}

.header h1{
    font-size:24px;
    font-weight:800;
}

.header p{
    margin-top:6px;
    color:#8d9bb0;
    font-size:12px;
}

/* WALLET RECHARGE MISSION */

.recharge-card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(22,101,52,.35),
            rgba(5,11,24,.98)
        );

    border:1px solid rgba(34,197,94,.35);

    border-radius:22px;

    padding:20px;

    margin-bottom:18px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.recharge-top{
    display:flex;
    align-items:center;
    gap:13px;
}

.recharge-icon{
    width:55px;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:
        linear-gradient(135deg,#22c55e,#16a34a);

    font-size:28px;

    box-shadow:
        0 8px 25px rgba(34,197,94,.25);

    flex-shrink:0;
}

.recharge-title{
    font-size:18px;
    font-weight:800;
}

.recharge-sub{
    color:#94a3b8;
    font-size:11px;
    margin-top:4px;
}

.recharge-info{
    margin-top:17px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:14px;

    border-radius:15px;

    background:rgba(34,197,94,.08);

    border:1px solid rgba(34,197,94,.15);
}

.recharge-label{
    color:#94a3b8;
    font-size:11px;
}

.recharge-value{
    margin-top:3px;
    color:#fff;
    font-size:20px;
    font-weight:800;
}

.bonus-value{
    color:#4ade80;
    font-size:20px;
    font-weight:800;
}

.recharge-status{
    margin-top:13px;

    padding:12px;

    text-align:center;

    border-radius:13px;

    background:#111827;

    color:#94a3b8;

    font-size:12px;
}

.claim-btn{
    width:100%;

    margin-top:13px;

    height:46px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(135deg,#22c55e,#16a34a);

    color:#001b09;

    font-size:13px;

    font-weight:800;

    cursor:pointer;
}

.claim-btn:active{
    transform:scale(.98);
}

.claim-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.claimed{
    color:#4ade80 !important;
}

/* SECTION */

.section-title{
    margin:22px 2px 12px;

    font-size:13px;

    color:#94a3b8;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:.7px;
}

/* MISSION CARD */

.mission-card{
    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(25,40,70,.95),
            rgba(5,11,24,.98)
        );

    border:1px solid rgba(255,215,0,.25);

    border-radius:22px;

    padding:20px;

    margin-bottom:15px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.mission-card.locked{
    opacity:.55;
    border-color:rgba(148,163,184,.15);
}

.mission-card.completed{
    border-color:rgba(34,197,94,.4);
}

.mission-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.mission-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.mission-icon{
    width:52px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(135deg,#FFD700,#ff9d00);

    font-size:26px;

    flex-shrink:0;
}

.mission-card.locked .mission-icon{
    background:#1f2937;
}

.mission-name{
    font-size:17px;
    font-weight:800;
}

.mission-subtitle{
    color:#8d9bb0;
    font-size:11px;
    margin-top:4px;
}

.lock-badge,
.completed-badge,
.available-badge{
    padding:5px 9px;

    border-radius:20px;

    font-size:9px;

    font-weight:800;

    flex-shrink:0;
}

.lock-badge{
    background:#1f2937;
    color:#94a3b8;
}

.available-badge{
    background:#22c55e18;
    color:#4ade80;
}

.completed-badge{
    background:#FFD70018;
    color:#FFD700;
}

.mission-description{
    color:#aeb9cc;

    font-size:13px;

    line-height:1.5;

    margin-top:15px;
}

/* REWARD */

.reward{
    margin-top:16px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:13px;

    background:rgba(255,215,0,.07);

    border:1px solid rgba(255,215,0,.18);

    border-radius:14px;
}

.reward-label{
    color:#9da9bb;

    font-size:10px;
}

.reward-value{
    color:#FFD700;

    font-size:21px;

    font-weight:800;

    margin-top:2px;
}

/* COUNT */

.count-box{
    margin-top:16px;
}

.count-row{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:8px;
}

.count-title{
    font-size:12px;

    color:#c9d2e2;
}

.count{
    font-size:14px;

    font-weight:800;
}

.progress{
    width:100%;

    height:10px;

    background:#111a2a;

    border-radius:20px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.06);
}

.progress-bar{
    width:0%;

    height:100%;

    background:
        linear-gradient(90deg,#22c55e,#FFD700);

    border-radius:20px;

    transition:width .5s ease;
}

/* STATUS */

.status{
    margin-top:14px;

    padding:11px;

    border-radius:12px;

    text-align:center;

    background:rgba(34,197,94,.08);

    border:1px solid rgba(34,197,94,.15);

    color:#86efac;

    font-size:11px;
}

.status.completed{
    background:rgba(255,215,0,.08);

    border-color:rgba(255,215,0,.25);

    color:#FFD700;
}

/* LOADING */

.loading{
    text-align:center;

    padding:50px 20px;

    color:#64748b;

    font-size:13px;
}

.spinner{
    width:30px;
    height:30px;

    margin:0 auto 12px;

    border:3px solid #1f2937;

    border-top-color:#22c55e;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* TOAST */

.toast{
    position:fixed;

    left:50%;

    bottom:25px;

    transform:translateX(-50%) translateY(100px);

    width:calc(100% - 40px);

    max-width:460px;

    padding:13px 15px;

    border-radius:13px;

    background:#111827;

    border:1px solid #ffffff15;

    box-shadow:0 10px 30px #0008;

    text-align:center;

    font-size:12px;

    z-index:9999;

    transition:.3s;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
}

.toast.success{
    color:#4ade80;

    border-color:#22c55e40;
}

.toast.error{
    color:#f87171;

    border-color:#ef444440;
}

@media(max-width:380px){

    body{
        padding:14px;
    }

    .header h1{
        font-size:21px;
    }

    .mission-card{
        padding:17px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>🎯 Missions</h1>

        <p>Complete missions aur wallet rewards earn karo</p>

    </div>


    <!-- RECHARGE MISSION -->

    <div class="recharge-card">

        <div class="recharge-top">

            <div class="recharge-icon">
                💰
            </div>

            <div>

                <div class="recharge-title">
                    First Recharge Bonus
                </div>

                <div class="recharge-sub">
                    First ₹100 wallet recharge complete karo
                </div>

            </div>

        </div>


        <div class="recharge-info">

            <div>

                <div class="recharge-label">
                    REQUIRED RECHARGE
                </div>

                <div class="recharge-value">
                    ₹100
                </div>

            </div>


            <div style="text-align:right;">

                <div class="recharge-label">
                    BONUS
                </div>

                <div class="bonus-value">
                    10%
                </div>

            </div>

        </div>


        <div
            id="rechargeStatus"
            class="recharge-status">

            🔄 Checking recharge status...

        </div>


        <button
            id="rechargeClaimBtn"
            class="claim-btn"
            disabled>

            🔒 Recharge ₹100 to Unlock

        </button>

    </div>


    <div class="section-title">
        Match Missions
    </div>


    <!-- MISSION LIST -->

    <div id="missionList">

        <div class="loading">

            <div class="spinner"></div>

            Loading missions...

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script type="module">

import { initializeApp }
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    update
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

    authDomain:
        "incoinpaysliveearning.firebaseapp.com",

    databaseURL:
        "https://incoinpaysliveearning-default-rtdb.firebaseio.com",

    projectId:
        "incoinpaysliveearning",

    storageBucket:
        "incoinpaysliveearning.firebasestorage.app",

    messagingSenderId:
        "971873814750",

    appId:
        "1:971873814750:web:7418c7da119e4725ed9a4f"

};


/* =====================================================
   FIREBASE INIT
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* =====================================================
   ELEMENTS
===================================================== */

const missionList =
    document.getElementById("missionList");

const rechargeStatus =
    document.getElementById("rechargeStatus");

const rechargeClaimBtn =
    document.getElementById("rechargeClaimBtn");

const toast =
    document.getElementById("toast");


/* =====================================================
   MISSION CONFIG
===================================================== */

const missions = [

    {
        id:"mission1",
        number:1,
        target:100,
        reward:50,
        icon:"🎯"
    },

    {
        id:"mission2",
        number:2,
        target:200,
        reward:150,
        icon:"🔥"
    },

    {
        id:"mission3",
        number:3,
        target:500,
        reward:500,
        icon:"👑"
    }

];


/* =====================================================
   USER STATE
===================================================== */

let currentUser = null;

let userData = {};

let walletBalance = 0;


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(auth,(user)=>{

    if(!user){

        location.replace("index.html");

        return;

    }

    currentUser = user;

    loadUser(user.uid);

});


/* =====================================================
   LOAD USER
===================================================== */

function loadUser(uid){

    const userRef =
        ref(
            db,
            "users/" + uid
        );


    onValue(

        userRef,

        (snapshot)=>{

            if(!snapshot.exists()){

                userData = {};

                walletBalance = 0;

                renderMissions(0);

                updateRechargeMission(0);

                return;

            }


            userData =
                snapshot.val() || {};


            walletBalance =
                getWalletBalance(userData);


            let matchCount =
                Number(
                    userData.missionMatches || 0
                );


            if(!Number.isFinite(matchCount))
                matchCount = 0;


            if(matchCount < 0)
                matchCount = 0;


            renderMissions(matchCount);

            updateRechargeMission(walletBalance);

        },

        (error)=>{

            console.error(
                "User load error:",
                error
            );

            showToast(
                "Unable to load mission data.",
                "error"
            );

        }

    );

}


/* =====================================================
   WALLET BALANCE
===================================================== */

function getWalletBalance(data){

    let balance = 0;


    if(
        data.wallet &&
        typeof data.wallet === "object"
    ){

        balance =
            Number(
                data.wallet.balance ?? 0
            );

    }
    else{

        balance =
            Number(
                data.wallet ?? 0
            );

    }


    if(!Number.isFinite(balance))
        balance = 0;


    return balance;

}


/* =====================================================
   RENDER MISSIONS
===================================================== */

function renderMissions(matchCount){

    missionList.innerHTML = "";


    missions.forEach((mission,index)=>{

        const previous =
            index === 0
            ? true
            : matchCount >=
              missions[index - 1].target;


        const completed =
            matchCount >= mission.target;


        const locked =
            !previous;


        const card =
            document.createElement("div");


        card.className =
            "mission-card" +
            (locked ? " locked" : "") +
            (completed ? " completed" : "");


        let badgeHTML = "";


        if(completed){

            badgeHTML =
                `<div class="completed-badge">
                    ✓ COMPLETED
                 </div>`;

        }
        else if(locked){

            badgeHTML =
                `<div class="lock-badge">
                    🔒 LOCKED
                 </div>`;

        }
        else{

            badgeHTML =
                `<div class="available-badge">
                    ● ACTIVE
                 </div>`;

        }


        let progress =
            (matchCount / mission.target) * 100;


        if(progress > 100)
            progress = 100;


        if(progress < 0)
            progress = 0;


        let visibleCount =
            Math.min(
                matchCount,
                mission.target
            );


        card.innerHTML = `

            <div class="mission-head">

                <div class="mission-left">

                    <div class="mission-icon">
                        ${locked ? "🔒" : mission.icon}
                    </div>

                    <div>

                        <div class="mission-name">
                            Mission ${mission.number}
                        </div>

                        <div class="mission-subtitle">
                            ${mission.target} Matches
                        </div>

                    </div>

                </div>

                ${badgeHTML}

            </div>


            <div class="mission-description">

                ${
                    locked
                    ? "Previous mission complete hone ke baad ye mission unlock hoga."
                    : completed
                    ? "Mission successfully completed. Reward claim ho chuka hai ya claim ke liye ready hai."
                    : `${mission.target} matches join karo aur ₹${mission.reward} wallet reward pao.`
                }

            </div>


            <div class="reward">

                <div>

                    <div class="reward-label">
                        WALLET REWARD
                    </div>

                    <div class="reward-value">
                        ₹${mission.reward}
                    </div>

                </div>

                <div style="font-size:26px;">
                    🎁
                </div>

            </div>


            <div class="count-box">

                <div class="count-row">

                    <div class="count-title">
                        Matches Joined
                    </div>

                    <div class="count">
                        ${visibleCount}/${mission.target}
                    </div>

                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width:${progress}%">
                    </div>

                </div>

            </div>


            <div class="status ${
                completed ? "completed" : ""
            }">

                ${
                    completed
                    ? "🎉 Mission Completed — Reward Ready"
                    : locked
                    ? "🔒 Complete previous mission to unlock"
                    : `🔥 ${mission.target - matchCount} more match join karo`
                }

            </div>

        `;


        missionList.appendChild(card);

    });

}


/* =====================================================
   RECHARGE MISSION
===================================================== */

function updateRechargeMission(balance){

    const claimed =
        userData.firstRechargeBonusClaimed === true ||
        userData.firstRechargeBonusClaimed === "true";


    const rechargeCompleted =
        userData.firstRechargeCompleted === true ||
        userData.firstRechargeCompleted === "true" ||
        Number(
            userData.totalRecharge ||
            userData.totalRecharged ||
            userData.rechargeAmount ||
            0
        ) >= 100;


    if(claimed){

        rechargeStatus.innerText =
            "🎉 10% First Recharge Bonus Claimed";

        rechargeStatus.classList.add(
            "claimed"
        );

        rechargeClaimBtn.innerText =
            "✓ Bonus Already Claimed";

        rechargeClaimBtn.disabled =
            true;

        return;

    }


    if(rechargeCompleted){

        rechargeStatus.innerText =
            "🎉 ₹100 recharge completed — 10% bonus ready to claim";

        rechargeClaimBtn.innerText =
            "🎁 Claim 10% Bonus";

        rechargeClaimBtn.disabled =
            false;

        rechargeClaimBtn.onclick =
            claimRechargeBonus;

        return;

    }


    rechargeStatus.innerText =
        "💳 First ₹100 recharge complete karo";


    rechargeClaimBtn.innerText =
        "🔒 Recharge ₹100 to Unlock";


    rechargeClaimBtn.disabled =
        true;

}


/* =====================================================
   CLAIM RECHARGE BONUS
===================================================== */

async function claimRechargeBonus(){

    if(!currentUser)
        return;


    if(
        userData.firstRechargeBonusClaimed === true
    ){

        showToast(
            "Bonus already claimed.",
            "error"
        );

        return;

    }


    const rechargeAmount =
        Number(
            userData.totalRecharge ||
            userData.totalRecharged ||
            userData.rechargeAmount ||
            0
        );


    const firstRechargeCompleted =
        userData.firstRechargeCompleted === true ||
        userData.firstRechargeCompleted === "true";


    if(
        rechargeAmount < 100 &&
        !firstRechargeCompleted
    ){

        showToast(
            "First ₹100 recharge complete karein.",
            "error"
        );

        return;

    }


    /*
       10% of ₹100 = ₹10

       Important:
       Bonus ko automatically arbitrary wallet balance
       ke basis par calculate nahi kiya gaya.
    */

    const bonus =
        10;


    rechargeClaimBtn.disabled =
        true;

    rechargeClaimBtn.innerText =
        "Claiming...";


    try{

        const userRef =
            ref(
                db,
                "users/" +
                currentUser.uid
            );


        const newWallet =
            walletBalance +
            bonus;


        await update(

            userRef,

            {

                "wallet":
                    newWallet,

                "firstRechargeBonus":
                    bonus,

                "firstRechargeBonusClaimed":
                    true,

                "firstRechargeBonusClaimedAt":
                    Date.now()

            }

        );


        showToast(
            "🎉 ₹10 bonus wallet me add ho gaya!",
            "success"
        );


    }
    catch(error){

        console.error(
            "Bonus claim error:",
            error
        );


        rechargeClaimBtn.disabled =
            false;

        rechargeClaimBtn.innerText =
            "🎁 Claim 10% Bonus";


        showToast(
            "Bonus claim failed. Firebase Rules check karein.",
            "error"
        );

    }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message,type){

    toast.innerText =
        message;

    toast.className =
        "toast show " +
        type;


    setTimeout(()=>{

        toast.className =
            "toast";

    },3500);

}

</script>

</body>

</html>
